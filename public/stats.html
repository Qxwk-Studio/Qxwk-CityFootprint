<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全站统计 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="City Footprint 全站统计：总行程、总城市、去过的城市次数排名。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<style>
  /* ========= Reset & Base ========= */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0d9488;
    --surface: #ffffff;
    --bg: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --border: #e2e8f0;
    --navbar-bg: rgba(255, 255, 255, 0.8);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --container: 1100px;
    --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========= Navbar ========= */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: var(--nav-height);
    background: var(--navbar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .navbar-inner {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    gap: 12px;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.3px;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .navbar-brand:hover { opacity: 0.85; }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
  }
  .brand-text { line-height: 1.25; }
  .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .brand-text span { font-size: 11px; color: var(--text-tertiary); }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(37, 99, 235, 0.15);
    color: var(--text-primary);
    text-decoration: none;
    border-radius: 40px;
    font-size: 0.88rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(147, 197, 253, 0.35);
    transition: all var(--transition);
    white-space: nowrap;
  }
  .back-link:hover {
    background: rgba(37, 99, 235, 0.3);
    border-color: rgba(147, 197, 253, 0.6);
    transform: scale(1.02);
  }

  /* ========= Main ========= */
  .main { flex: 1; padding: 36px 24px 60px; }
  .container { max-width: var(--container); margin: 0 auto; }
  .page-header { display: flex; align-items: center; margin-bottom: 28px; }
  .page-header h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 700; color: var(--text-primary); }

  /* ========= 统计大数字卡片 ========= */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .stat-card .label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
  }

  /* 管理员视图提示 */
  .admin-view-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    background: #fffbeb;
    border: 1px solid #fcd34d;
    color: #92400e;
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* ========= 城市排名 ========= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .card h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .rank-item:last-child { border-bottom: none; }
  .rank-no {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-no.top { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; }

  /* 成就达成人数 */
  .ach-count-cat {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 14px 0 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .ach-count-cat:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .ach-count-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--border);
  }
  .ach-count-item:last-child { border-bottom: none; }
  .ach-count-icon { font-size: 1.1rem; flex-shrink: 0; }
  .ach-count-name { flex: 1; font-size: 1rem; font-weight: 600; min-width: 0; }
  .ach-count-desc { font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); margin-left: 6px; }
  .ach-count-num { font-size: 0.9rem; font-weight: 600; color: var(--text-tertiary); flex-shrink: 0; }
  .ach-count-num.done { color: var(--primary); }
  .rank-city { flex: 1; font-weight: 600; font-size: 1.05rem; min-width: 0; }
  .rank-province { font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); margin-left: 6px; }
  .rank-meta { font-size: 0.8rem; color: var(--text-tertiary); flex-shrink: 0; }
  .rank-count { font-size: 0.9rem; font-weight: 600; color: var(--primary); flex-shrink: 0; min-width: 34px; text-align: right; }

  /* ========= Footer ========= */
  .footer {
    background: #0f172a;
    text-align: center;
    padding: 14px 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .footer-copy { opacity: 0.6; }

  /* ========= 加载/空态 ========= */
  .loading, .empty {
    text-align: center;
    color: var(--text-tertiary);
    padding: 40px 0;
    font-size: 0.9rem;
  }

  /* ========= Responsive ========= */
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 12px; }
    .main { padding: 20px 12px 32px; }
    .card { padding: 14px; }
    .back-link { padding: 6px 12px; font-size: 0.82rem; }
    .footer { padding: 12px 12px; }
    .page-header { margin-bottom: 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
<meta name="color-scheme" content="light dark">
<script>
/* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
(function () {
  var KEY = 'theme';
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function system() { return mq.matches ? 'dark' : 'light'; }
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
  function apply(t) { root.setAttribute('data-theme', t); }
  function current() { return stored() || system(); }
  apply(current());
  function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
  // 按钮轮询绑定（不依赖 DOMContentLoaded，避免被外部脚本阻塞导致按钮长时间无效）
  (function tryBind() {
    var btn = document.getElementById('themeToggle');
    if (btn) btn.addEventListener('click', toggle);
    else setTimeout(tryBind, 50);
  })();
  if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
})();
</script>
<style>
  /* ===== 黑夜模式：主题切换按钮 ===== */
  .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); position:relative; z-index:5; touch-action:manipulation; }
  .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
  .theme-toggle svg { width:22px; height:22px; }
  .theme-toggle .icon-sun { display:none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

  /* ===== 黑夜模式：深色变量 ===== */
  :root { color-scheme: light; --primary-subtle: rgba(37,99,235,0.08); }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary-light: rgba(59,130,246,0.16);
    --primary-subtle: rgba(59,130,246,0.16);
    --surface:#1e293b; --bg:#0f172a;
    --text-primary:#e2e8f0; --text-secondary:#94a3b8; --text-tertiary:#64748b;
    --border:#334155; --navbar-bg:rgba(15,23,42,0.8);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.4); --shadow-md:0 4px 16px rgba(0,0,0,0.5); --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
  }
  :root[data-theme="dark"] .footer { background:#111827; }
  :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
  :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }

  /* ===== 黑夜模式：页面元素覆盖 ===== */
  :root[data-theme="dark"] .admin-view-note { background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.35); color:#fbbf24; }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="City Footprint">
      <span class="brand-text"><b>City Footprint</b><span>我们走过的城市</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="index.html" class="back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        返回地图
      </a>
    </div>
  </div>
</header>

<div class="main">
  <div class="container">
    <div class="page-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        全站统计
      </h1>
    </div>

    <div id="adminViewNote" class="admin-view-note" style="display:none;">👑 管理员视图 · 正在统计全部行程（含私密）</div>

    <!-- 总览 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">✈️ 总行程</div>
        <div class="value" id="totalVisits">-</div>
      </div>
      <div class="stat-card">
        <div class="label">🏙️ 总城市</div>
        <div class="value" id="totalCities">-</div>
      </div>
      <div class="stat-card">
        <div class="label">🗺️ 覆盖省份</div>
        <div class="value" id="totalProvinces">-</div>
      </div>
      <div class="stat-card">
        <div class="label">👥 总用户</div>
        <div class="value" id="totalUsers">-</div>
      </div>
    </div>

    <!-- 城市次数排名 -->
    <div class="card">
      <h3>🏆 去过的城市次数排名</h3>
      <div id="cityRankList"><div class="loading">正在加载统计…</div></div>
    </div>

    <!-- 成就达成人数 -->
    <div class="card">
      <h3>🏅 成就达成人数</h3>
      <div id="achievementCountList"><div class="loading">正在加载统计…</div></div>
    </div>

  </div>
</div>

<footer class="footer">
  <div class="footer-copy">2026 青翔未阔工作室 · City Footprint</div>
</footer>

<script src="cities.js"></script>
<script src="app.js"></script>
<script src="achievements.js"></script>
<script>
// 城市→省份（从内置城市数据查询）
function findProvince(city) {
  const c = (window.CITIES || []).find(x => x.name === city);
  return c ? c.province : '';
}

// 拉取全站统计（api() 自动携带登录凭证，管理员能看到含私密的完整统计）
api('/stats')
  .then(data => {
    // 管理员视图提示（数据来自后端 isAdmin，始终与所见一致）
    const adminNote = document.getElementById('adminViewNote');
    if (adminNote) adminNote.style.display = data.isAdmin ? '' : 'none';

    document.getElementById('totalVisits').textContent = data.totalVisits;
    document.getElementById('totalCities').textContent = data.totalCities;
    document.getElementById('totalUsers').textContent = (data.users || []).length;
    // 覆盖省份数：从城市排名去重省份
    const provs = new Set((data.cityRank || []).map(c => findProvince(c.city)).filter(Boolean));
    document.getElementById('totalProvinces').textContent = provs.size;

    const list = document.getElementById('cityRankList');
    if (!data.cityRank.length) {
      list.innerHTML = '<div class="empty">还没有任何足迹，去添加第一座城市吧 ✈️</div>';
      return;
    }
    list.innerHTML = '';
    const top = data.cityRank.slice(0, 30); // 只显示前 30 名
    top.forEach((c, i) => {
      const item = document.createElement('div');
      item.className = 'rank-item';
      const province = findProvince(c.city);
      item.innerHTML = `
        <span class="rank-no${i < 3 ? ' top' : ''}">${i + 1}</span>
        <span class="rank-city">${c.city}${province ? '<span class="rank-province">· ' + province + '</span>' : ''}</span>
        <span class="rank-meta">去过 ${c.people} 人</span>
        <span class="rank-count">${c.count} 次</span>`;
      list.appendChild(item);
    });
    if (data.cityRank.length > 30) {
      const more = document.createElement('div');
      more.className = 'empty';
      more.textContent = '… 共 ' + data.cityRank.length + ' 座城市，仅显示前 30 名';
      list.appendChild(more);
    }

    // 成就达成人数：统计每个成就被多少用户达成
    const achCount = {};
    for (const u of (data.users || [])) {
      const cities = (u.cities || '').split(',').filter(Boolean);
      const cats = getAchievements(cities);
      for (const cat of cats) {
        for (const a of cat.items) {
          if (a.done) achCount[a.name] = (achCount[a.name] || 0) + 1;
        }
      }
    }
    const achList = document.getElementById('achievementCountList');
    achList.innerHTML = '';
    getAchievements([]).forEach(cat => {
      const catEl = document.createElement('div');
      catEl.className = 'ach-count-cat';
      catEl.textContent = cat.title;
      achList.appendChild(catEl);
      cat.items.forEach(a => {
        const item = document.createElement('div');
        item.className = 'ach-count-item';
        const n = achCount[a.name] || 0;
        item.innerHTML = `
          <span class="ach-count-icon">${a.icon}</span>
          <span class="ach-count-name">${a.name}${a.desc ? '<span class="ach-count-desc">' + a.desc + '</span>' : ''}</span>
          <span class="ach-count-num ${n > 0 ? 'done' : ''}">${n} 人</span>`;
        achList.appendChild(item);
      });
    });
  })
  .catch(() => {
    document.getElementById('cityRankList').innerHTML = '<div class="empty">统计加载失败，请稍后重试</div>';
  });
</script>
</body>
</html>
