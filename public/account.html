<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff;
    --secondary: #0d9488; --surface: #ffffff; --bg: #f8fafc;
    --text-primary: #0f172a; --text-secondary: #64748b; --text-tertiary: #94a3b8;
    --border: #e2e8f0; --navbar-bg: rgba(255, 255, 255, 0.8);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06); --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --container: 1100px; --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans); background: var(--bg); color: var(--text-primary);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  body.no-scroll { overflow: hidden; }
  .navbar { position: sticky; top: 0; z-index: 1000; height: var(--nav-height);
    background: var(--navbar-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border); }
  .navbar-inner { max-width: var(--container); margin: 0 auto; padding: 0 24px; height: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .navbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none;
    color: var(--text-primary); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.3px;
    transition: opacity var(--transition); flex-shrink: 0; }
  .navbar-brand:hover { opacity: 0.85; }
  .brand-logo { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    object-fit: cover; box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25); }
  .brand-text { line-height: 1.25; }
  .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .brand-text span { font-size: 11px; color: var(--text-tertiary); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
    background: rgba(37, 99, 235, 0.15); color: var(--text-primary); text-decoration: none;
    border-radius: 40px; font-size: 0.88rem; font-weight: 500; backdrop-filter: blur(4px);
    border: 1px solid rgba(147, 197, 253, 0.35); transition: all var(--transition);
    white-space: nowrap; }
  .back-link:hover { background: rgba(37, 99, 235, 0.3); border-color: rgba(147, 197, 253, 0.6); transform: scale(1.02); }
  .main { flex: 1; padding: 36px 24px 60px; }
  .container { max-width: var(--container); margin: 0 auto; }
  .page-header { display: flex; align-items: center; margin-bottom: 28px; }
  .page-header h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 700; color: var(--text-primary); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
  .card h3 { font-size: 1.02rem; font-weight: 600; margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 40px; padding: 11px 18px; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all var(--transition); font-family: inherit; text-decoration: none; }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; width: 100%; }
  .btn-primary:hover { background: linear-gradient(135deg, var(--primary-hover), #0f766e);
    box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .btn-ghost { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); color: var(--text-primary); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
  .hint { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }
  .user-uid { margin-top: 4px; font-size: 0.78rem; color: var(--text-tertiary);
    font-family: 'Consolas', 'Courier New', monospace; }
  .user-color-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border); flex-shrink: 0; }
  .user-regtime { margin-top: 6px; font-size: 0.78rem; color: var(--text-tertiary); }
  #userView .card { padding: 28px; }
  .profile-card { background: linear-gradient(135deg, color-mix(in srgb, var(--user-color, #2563eb) 15%, #ffffff), var(--surface) 80%);
    border-color: color-mix(in srgb, var(--user-color, #2563eb) 22%, #e2e8f0); }
  .profile-head { display: flex; align-items: flex-start; gap: 18px; }
  .profile-avatar { width: 64px; height: 64px; border-radius: 20px; flex-shrink: 0; overflow: hidden;
    background: var(--primary); color: #fff; font-size: 1.8rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.28); }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
  .profile-meta { display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
    color: var(--text-secondary); margin-bottom: 4px; }
  .profile-color { display: flex; align-items: center; gap: 10px; margin-top: 18px;
    padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.95rem;
    font-weight: 500; color: var(--text-secondary); }
  .profile-color .user-color-dot { width: 22px; height: 22px; }
  .action-card { text-align: left; }
  .action-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
  .action-card .btn { margin-top: 16px; }

  /* ========= 退出登录：大卡片（与通行证 account 一致） ========= */
  .card-logout {
    text-align: center;
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(220, 38, 38, 0.08) 0%, rgba(220, 38, 38, 0) 60%),
      var(--surface);
    border: 1px solid #fecaca;
    border-radius: var(--radius-md);
    padding: 32px 26px;
    box-shadow: var(--shadow-sm);
  }
  .card-logout h3 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 10px;
  }
  .card-logout .logout-tip {
    text-align: center;
    padding: 0 0 20px;
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  .btn-logout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 11px 18px;
    border: none;
    border-radius: 40px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    transition: all var(--transition);
  }
  .btn-logout:hover {
    background: linear-gradient(135deg, #f87171, #ef4444);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-logout:active { transform: translateY(0) scale(0.98); }
  .btn-logout svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* 管理员标签（原退出按钮位置：profile-head 右上角） */
  .admin-badge-head {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-radius: 6px;
    padding: 4px 10px;
    align-self: flex-start;
  }

  .personal-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .personal-col { display: flex; flex-direction: column; gap: 20px; }
  .personal-col .card { margin-bottom: 0; }
  #authView { position: fixed; left: 0; right: 0; top: var(--nav-height); bottom: 0;
    z-index: 900; display: grid; grid-template-columns: 60% 40%;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .auth-left { position: relative; height: 100%; overflow: hidden; background: #e2e2ec; }
  .setup-frame { width: 100%; height: 100%; border: 0; display: block; }
  .auth-right { background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .auth-form { width: 100%; max-width: 380px; margin: 0; }
  .auth-title { font-size: 1.7rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
  .auth-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 28px; }
  .passport-tip { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 14px; text-align: center; }
  .passport-tip a { color: var(--primary); text-decoration: none; }
  .passport-tip a:hover { text-decoration: underline; }

  /* ========= 加载中：校验会话时的过渡界面 ========= */
  .loading-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--text-secondary);
    font-size: 0.92rem;
  }
  .loading-spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer { background: #0f172a; text-align: center; padding: 14px 24px; color: var(--text-tertiary);
    font-size: 0.82rem; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .footer-copy { opacity: 0.6; }
  @media (max-width: 768px) {
    .personal-layout { grid-template-columns: 1fr; }
    #authView { grid-template-columns: 1fr; grid-template-rows: 30vh 1fr; }
    .auth-left { height: 30vh; }
    .auth-right { align-items: flex-start; padding: 40px 12px 32px; }
    .auth-form { max-width: 100%; }
  }
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 12px; }
    .main { padding: 20px 12px 32px; }
    .card { padding: 14px; }
    .back-link { padding: 6px 12px; font-size: 0.82rem; }
    .footer { padding: 12px 12px; }
    .page-header { margin-bottom: 20px; }
    #userView .card { padding: 20px; }
    #userView .profile-card { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
<meta name="color-scheme" content="light dark"><script>
(function () {
  var KEY = 'theme';
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function system() { return mq.matches ? 'dark' : 'light'; }
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
  function apply(t) { root.setAttribute('data-theme', t); }
  function current() { return stored() || system(); }
  apply(current());
  function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
  (function tryBind() {
    var btn = document.getElementById('themeToggle');
    if (btn) btn.addEventListener('click', toggle);
    else setTimeout(tryBind, 50);
  })();
  if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
})();
</script>
<style>

    cursor:pointer; transition:background var(--transition), color var(--transition);

  :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }
  :root { color-scheme: light; --primary-subtle: rgba(37,99,235,0.08); }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary-light: rgba(59,130,246,0.16); --primary-subtle: rgba(59,130,246,0.16);
    --surface:#1e293b; --bg:#0f172a;

    --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
  }
  :root[data-theme="dark"] .footer { background:#111827; }

  /* 黑夜模式：退出登录卡片 */
  :root[data-theme="dark"] .card-logout {

      var(--surface);
    border-color: rgba(239,68,68,0.35);
  }
  :root[data-theme="dark"] .card-logout h3 { color: var(--text-primary); }
</style>

<script>
// 通行证登录入口：弹窗方式打开 login.html（popup=1），登录成功后回传 token 并自动关窗，app.js 监听 message 落地
document.getElementById('passportLoginBtn').addEventListener('click', function () {
  passportLogin();
});

// 展示未登录界面（无会话，或会话校验失败）
function showAuthView() {
  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('authView').style.display = '';
  document.body.classList.remove('no-scroll');
}

function enterUserView() {
  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('authView').style.display = 'none';
  document.body.classList.remove('no-scroll');
  const mainEl = document.getElementById('mainContent');
  if (mainEl) mainEl.style.display = '';
  document.getElementById('userView').style.display = '';
  const s = getSession();
  // 专属颜色驱动主卡渐变背景
  if (s && s.color) document.documentElement.style.setProperty('--user-color', s.color);
  document.getElementById('welcomeText').textContent = (s ? s.nickname : '') + '，欢迎回来 👋';
  const badge = document.getElementById('adminBadge');
  if (badge) badge.style.display = (s && s.is_admin) ? '' : 'none';
  const uidEl = document.getElementById('userUid');
  if (uidEl && s) uidEl.textContent = 'UID：' + s.userId;
  // 大头像：直接使用通行证返回的头像链接，无链接或加载失败回退昵称首字 + 专属颜色
  const avatar = document.getElementById('profileAvatar');
  if (avatar && s) {
    setAvatarFromUrl(avatar, s.avatar, s.nickname, s.color);

  }
  // 专属颜色（地图打点色）
  const colorDot = document.getElementById('userColor');
  if (colorDot && s && s.color) {
    colorDot.style.background = s.color;
    colorDot.style.boxShadow = '0 0 0 3px ' + s.color + '40';
  }
  // 注册时间（来自 /api/me 的 created_at）
  const regEl = document.getElementById('userRegTime');
  if (regEl && window._regTime) regEl.textContent = '注册于 ' + window._regTime;
}

// 页面加载顺序：
// 本脚本执行时本地可能已有 session（登录落地后 / 直接访问且有 token）
// 有 token 验证 /api/me，成功进 userView，失败清掉跳通行证登录
// 先等 SSO 落地（微信等整页回跳场景：URL 带 token 需先落地再判会话），再进入初始化
Promise.resolve(window._ssoLanding).then(function () {
  if (getSession()) {
    api('/me')
      .then(data => {
        if (data && data.created_at) {
          const s = String(data.created_at);
          const d = new Date(s.replace(' ', 'T'));
          window._regTime = isNaN(d.getTime()) ? s.slice(0, 10) : d.toLocaleDateString('zh-CN');
        }
        if (data && data.userId) {
          localStorage.setItem('qxwf_user', JSON.stringify({
            userId: data.userId,
            nickname: data.nickname,
            color: data.color,
            is_admin: !!data.is_admin,
            avatar: data.avatar || null,
          }));
        }
        enterUserView();
      })
      .catch(() => {
        // token 失效：app.js 的 401 处理已清除本地会话并重载回登录视图；其余失败同样回未登录界面
        showAuthView();
      });
  } else {
    // 无 session：直接展示未登录界面（无需请求）
    showAuthView();
  }
});
</script>
</body>
</html>
