<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>足迹管理 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="管理你在 City Footprint 的城市足迹：添加、修改、删除行程，查看成就进度。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<style>
  /* ========= Reset & Base ========= */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0d9488;
    --surface: #ffffff;
    --bg: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --border: #e2e8f0;
    --navbar-bg: rgba(255, 255, 255, 0.8);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --container: 1100px;
    --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========= Navbar ========= */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: var(--nav-height);
    background: var(--navbar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .navbar-inner {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    gap: 12px;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.3px;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .navbar-brand:hover { opacity: 0.85; }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
  }
  .brand-text { line-height: 1.25; }
  .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .brand-text span { font-size: 11px; color: var(--text-tertiary); }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(37, 99, 235, 0.15);
    color: var(--text-primary);
    text-decoration: none;
    border-radius: 40px;
    font-size: 0.88rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(147, 197, 253, 0.35);
    transition: all var(--transition);
    white-space: nowrap;
  }
  .back-link:hover {
    background: rgba(37, 99, 235, 0.3);
    border-color: rgba(147, 197, 253, 0.6);
    transform: scale(1.02);
  }

  /* ========= Main ========= */
  .main { flex: 1; padding: 36px 24px 60px; }
  .container { max-width: var(--container); margin: 0 auto; }
  .page-header { display: flex; align-items: center; margin-bottom: 28px; }
  .page-header h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 700; color: var(--text-primary); }

  /* ========= Card ========= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .card h3 { font-size: 1.02rem; font-weight: 600; margin-bottom: 16px; }

  /* ========= Form ========= */
  label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .field { margin-bottom: 16px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  /* ========= Buttons ========= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 40px;
    padding: 11px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--primary-hover), #0f766e);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-ghost { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); color: var(--text-primary); }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }

  /* ========= 足迹列表 ========= */
  .visit-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .visit-item:last-child { border-bottom: none; }
  .visit-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .visit-main { flex: 1; min-width: 0; }
  .visit-city { font-weight: 600; font-size: 0.98rem; }
  .visit-private-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-tertiary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    vertical-align: 1px;
  }
  .visit-meta { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 2px; }
  .visit-note { font-size: 0.84rem; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .visit-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { text-align: center; color: var(--text-tertiary); font-size: 0.9rem; padding: 36px 0; }
  .msg { font-size: 0.84rem; margin-top: 10px; }
  .msg.error { color: #dc2626; }
  .msg.ok { color: #16a34a; }

  .date-selects { display: flex; gap: 8px; }
  .date-selects select { flex: 1; }

  .check-row { display: flex; align-items: center; gap: 8px; }
  .check-row input[type=checkbox] { width: auto; }
  .check-row label { margin-bottom: 0; }
  .hint { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }

  .note-count { font-size: 0.78rem; color: var(--text-tertiary); }

  /* 足迹统计卡 */
  .visit-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 16px;
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .visit-stats .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .visit-stats .stat b { font-size: 1.3rem; font-weight: 700; color: var(--primary); line-height: 1.15; }
  .visit-stats .stat b.date-range { font-size: 1.02rem; }
  .stat-label { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); }

  /* 个人中心两列布局（电脑端两列；手机端单列） */
  .personal-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  .personal-col { display: flex; flex-direction: column; gap: 20px; }
  .personal-col .card { margin-bottom: 0; }

  /* 可折叠卡片 */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    margin-bottom: 12px;
  }
  .card-header h3 { margin-bottom: 0; }
  .card-toggle { color: var(--text-tertiary); transition: transform 0.2s ease; flex-shrink: 0; }
  .visit-list-card.collapsed .card-toggle { transform: rotate(-90deg); }
  .visit-list-card.collapsed #visitList { display: none; }
  .achievement-card .card-header { margin-bottom: 18px; }
  .achievement-card.collapsed .card-toggle { transform: rotate(-90deg); }
  .achievement-card.collapsed .achievement-grid { display: none; }

  /* 成就卡片 */
  .achievement-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .achievement {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    text-align: left;
    opacity: 0.45;
    transition: all var(--transition);
    overflow: hidden;
  }
  .achievement.done {
    opacity: 1;
    border-color: rgba(37, 99, 235, 0.4);
    background: var(--primary-light);
  }
  .achievement .icon { font-size: 1.1rem; flex-shrink: 0; }
  .achievement .name { font-size: 0.85rem; font-weight: 600; flex-shrink: 0; }
  .achievement .desc { font-size: 0.75rem; color: var(--text-tertiary); flex: 1 1 0; min-width: 0; max-width: 100%; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }

  .category-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 成就分类折叠 */
  .achievement-category { margin-bottom: 14px; }
  .achievement-category:last-child { margin-bottom: 0; }
  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    transition: all var(--transition);
  }
  .category-header:hover { border-color: var(--primary); }
  .category-title { font-size: 0.9rem; font-weight: 600; flex: 1; }
  .category-progress { font-size: 0.75rem; color: var(--text-tertiary); }
  .category-toggle { color: var(--text-tertiary); transition: transform 0.2s ease; flex-shrink: 0; }
  .achievement-category.collapsed .category-toggle { transform: rotate(-90deg); }
  .achievement-category.collapsed .category-body { display: none; }

  /* ========= Footer ========= */
  .footer {
    background: #0f172a;
    text-align: center;
    padding: 28px 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .footer-copy { opacity: 0.6; }

  /* ========= Responsive ========= */
  @media (max-width: 768px) {
    .personal-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 16px; }
    .main { padding: 24px 16px 40px; }
    .card { padding: 18px; }
    .back-link { padding: 7px 14px; font-size: 0.84rem; }
    .theme-toggle { width: 40px; height: 40px; }
    .row { flex-direction: column; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
<meta name="color-scheme" content="light dark">
<script>
/* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
(function () {
  var KEY = 'theme';
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function system() { return mq.matches ? 'dark' : 'light'; }
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
  function apply(t) { root.setAttribute('data-theme', t); }
  function current() { return stored() || system(); }
  apply(current());
  function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
  function bind() {
    var btn = document.getElementById('themeToggle');
    if (btn) btn.addEventListener('click', toggle);
    if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
    else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
    window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
})();
</script>
<style>
  /* ===== 黑夜模式：主题切换按钮 ===== */
  .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); position:relative; z-index:5; touch-action:manipulation; }
  .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
  .theme-toggle svg { width:22px; height:22px; }
  .theme-toggle .icon-sun { display:none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

  /* ===== 黑夜模式：深色变量 ===== */
  :root { color-scheme: light; --primary-subtle: rgba(37,99,235,0.08); }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary-light: rgba(59,130,246,0.16);
    --primary-subtle: rgba(59,130,246,0.16);
    --surface:#1e293b; --bg:#0f172a;
    --text-primary:#e2e8f0; --text-secondary:#94a3b8; --text-tertiary:#64748b;
    --border:#334155; --navbar-bg:rgba(15,23,42,0.8);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.4); --shadow-md:0 4px 16px rgba(0,0,0,0.5); --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
  }
  :root[data-theme="dark"] .footer { background:#111827; }
  :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
  :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }

  /* ===== 黑夜模式：页面元素覆盖 ===== */
  :root[data-theme="dark"] .btn-danger { background:rgba(239,68,68,0.16); color:#f87171; }
  :root[data-theme="dark"] .btn-danger:hover { background:rgba(239,68,68,0.25); }
</style>

<script>
// 未登录跳转个人中心（登录页）
if (!getSession()) {
  location.href = 'account.html';
}

// 城市下拉数据
const datalist = document.getElementById('cityList');
(window.CITIES || []).forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.name;
  datalist.appendChild(opt);
});

// 时间下拉（年 + 月），防止手输格式错误
(function() {
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  const currentYear = new Date().getFullYear();
  yearSel.innerHTML = '<option value="">年份</option>';
  for (let y = currentYear; y >= 2000; y--) {
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = y + ' 年';
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = '<option value="">仅年份</option>';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m).padStart(2, '0');
    opt.textContent = m + ' 月';
    monthSel.appendChild(opt);
  }
})();

let myVisits = [];

// 日期切换（记不清：禁用年月下拉并清空）
function toggleDate() {
  const forgot = document.getElementById('forgotDate').checked;
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  yearSel.disabled = forgot;
  monthSel.disabled = forgot;
  if (forgot) {
    yearSel.value = '';
    monthSel.value = '';
  }
}

// 从年/月下拉组合日期值（'2024' 或 '2024-08'），未选年返回 null
function getVisitDate() {
  const y = document.getElementById('visitYear').value;
  const m = document.getElementById('visitMonth').value;
  if (!y) return null;
  return m ? y + '-' + m : y;
}

// 更新备注字数提醒（x/100）
function updateNoteCount() {
  const el = document.getElementById('noteCount');
  const input = document.getElementById('visitNote');
  if (el && input) el.textContent = input.value.length + '/100';
}

// 行程记录折叠开关
function toggleVisitList() {
  document.getElementById('visitListCard').classList.toggle('collapsed');
}

// 更新足迹统计：去过几座城市（去重）+ 足迹总数
// 城市 → 省份
function findProvince(city) {
  const c = (window.CITIES || []).find(x => x.name === city);
  return c ? c.province : '未知';
}

function updateVisitStats() {
  const el = document.getElementById('visitStats');
  if (!el) return;
  const cityCount = new Set(myVisits.map(v => v.city)).size;
  const provinceCount = new Set(myVisits.map(v => findProvince(v.city))).size;
  const dates = myVisits.map(v => v.visit_date).filter(Boolean).sort();
  const first = dates[0] || '—';
  const last = dates[dates.length - 1] || '—';
  el.innerHTML = `
    <div class="stat">
      <span class="stat-label">✈️ 去过城市</span>
      <b>${cityCount}</b>
    </div>
    <div class="stat">
      <span class="stat-label">📍 足迹</span>
      <b>${myVisits.length}</b>
    </div>
    <div class="stat">
      <span class="stat-label">🗺️ 省份</span>
      <b>${provinceCount}</b>
    </div>
    <div class="stat">
      <span class="stat-label">⏳ 最早 · 最近</span>
      <b class="date-range">${first} → ${last}</b>
    </div>`;
}

// 渲染成就卡片（4 分类，每类可折叠）
function renderAchievements() {
  const el = document.getElementById('achievementGrid');
  if (!el) return;
  // 判定逻辑在 achievements.js 的 getAchievements
  const CATEGORIES = getAchievements(myVisits.map(v => v.city));
  el.innerHTML = CATEGORIES.map(cat => {
    const doneCount = cat.items.filter(a => a.done).length;
    return `
      <div class="achievement-category">
        <div class="category-header">
          <span class="category-title">${cat.title}</span>
          <span class="category-progress">${doneCount}/${cat.items.length}</span>
        </div>
        <div class="category-body">
          ${cat.items.map(a => `
            <div class="achievement${a.done ? ' done' : ''}">
              <div class="icon">${a.icon}</div>
              <div class="name">${a.name}</div>
              <div class="desc">${a.desc}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

// 成就卡片整体折叠开关
function toggleAchievement() {
  document.getElementById('achievementCard').classList.toggle('collapsed');
}

async function loadVisits() {
  const list = document.getElementById('visitList');
  try {
    const data = await api('/my-visits');
    myVisits = data.visits;
    updateVisitStats();
    renderAchievements();
    if (!myVisits.length) { list.innerHTML = '<div class="empty">还没有足迹，添加第一座城市吧 ✈️</div>'; return; }
    list.innerHTML = '';
    for (let i = 0; i < myVisits.length; i++) {
      const v = myVisits[i];
      const item = document.createElement('div');
      item.className = 'visit-item';
      item.innerHTML = `
        <span class="visit-dot">${myVisits.length - i}</span>
        <div class="visit-main">
          <div class="visit-city">${escapeHtml(v.city)}${v.is_private ? '<span class="visit-private-badge" title="不公开行程，仅自己可见">🔒 不公开</span>' : ''}</div>
          <div class="visit-meta">${escapeHtml(fmtDate(v.visit_date))}</div>
          ${v.note ? `<div class="visit-note">${escapeHtml(v.note)}</div>` : ''}
        </div>
        <div class="visit-actions">
          <button class="btn btn-ghost btn-sm" onclick="startEdit(${v.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="delVisit(${v.id})">删除</button>
        </div>`;
      list.appendChild(item);
    }
  } catch (err) {
    list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
  }
}

let editingId = null;
const submitBtn = () => document.querySelector('#addForm .btn-primary');

async function addVisit(e) {
  e.preventDefault();
  const msg = document.getElementById('addMsg');
  msg.className = 'msg error';
  const name = document.getElementById('visitCity').value.trim();
  const c = findCity(name);
  if (!c) { msg.textContent = '未找到该城市，请从下拉列表选择'; return false; }

  const payload = {
    city: name,
    lat: c.lat,
    lng: c.lng,
    visit_date: getVisitDate(),
    note: document.getElementById('visitNote').value.trim(),
    is_private: document.getElementById('visitPrivate').checked,
  };

  try {
    if (editingId) {
      await api('/visits/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      msg.textContent = '已保存修改 ✅';
      resetForm();
    } else {
      await api('/visits', { method: 'POST', body: JSON.stringify(payload) });
      msg.textContent = '已添加 ✅';
      document.getElementById('visitCity').value = '';
      document.getElementById('visitNote').value = '';
      document.getElementById('visitPrivate').checked = false;
    }
    msg.className = 'msg ok';
    loadVisits();
  } catch (err) { msg.textContent = err.message; }
  return false;
}

function startEdit(id) {
  const v = myVisits.find(x => x.id === id);
  if (!v) return;
  editingId = id;
  document.getElementById('visitCity').value = v.city;
  document.getElementById('visitNote').value = v.note || '';
  document.getElementById('visitPrivate').checked = !!v.is_private;
  updateNoteCount();
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  if (v.visit_date) {
    document.getElementById('forgotDate').checked = false;
    const parts = String(v.visit_date).split('-');
    yearSel.value = parts[0] || '';
    monthSel.value = parts[1] || '';
    yearSel.disabled = false;
    monthSel.disabled = false;
  } else {
    document.getElementById('forgotDate').checked = true;
    yearSel.value = '';
    monthSel.value = '';
    yearSel.disabled = true;
    monthSel.disabled = true;
  }
  const btn = submitBtn();
  btn.textContent = '保存修改';
  document.getElementById('formTitle').textContent = '✏️ 编辑行程';
  document.getElementById('addMsg').textContent = '正在编辑：' + v.city;
  document.getElementById('addMsg').className = 'msg ok';
  document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  document.getElementById('visitCity').value = '';
  yearSel.value = '';
  monthSel.value = '';
  document.getElementById('forgotDate').checked = false;
  yearSel.disabled = false;
  monthSel.disabled = false;
  document.getElementById('visitNote').value = '';
  document.getElementById('visitPrivate').checked = false;
  updateNoteCount();
  submitBtn().textContent = '添加';
  document.getElementById('formTitle').textContent = '✈️ 创建行程';
  document.getElementById('addMsg').textContent = '';
}

async function delVisit(id) {
  if (!confirm('确定删除这条足迹吗？')) return;
  try {
    await api('/visits/' + id, { method: 'DELETE' });
    loadVisits();
  } catch (err) { alert(err.message); }
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

// 验证本地凭证仍有效后加载足迹（token 失效由 app.js 401 跳转登录页）
if (getSession()) {
  api('/me')
    .then(() => loadVisits())
    .catch(() => {});
}
</script>
