<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人中心 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="登录 City Footprint，添加、修改、删除自己的城市足迹，记录去过的城市、访问时间与回忆备注。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<style>
  /* ========= Reset & Base ========= */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0d9488;
    --surface: #ffffff;
    --bg: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --border: #e2e8f0;
    --navbar-bg: rgba(255, 255, 255, 0.8);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --container: 1100px;
    --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========= Navbar ========= */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: var(--nav-height);
    background: var(--navbar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .navbar-inner {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    gap: 12px;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.3px;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .navbar-brand:hover { opacity: 0.85; }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
  }
  .brand-text { line-height: 1.25; }
  .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .brand-text span { font-size: 11px; color: var(--text-tertiary); }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(37, 99, 235, 0.15);
    color: var(--text-primary);
    text-decoration: none;
    border-radius: 40px;
    font-size: 0.88rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(147, 197, 253, 0.35);
    transition: all var(--transition);
    white-space: nowrap;
  }
  .back-link:hover {
    background: rgba(37, 99, 235, 0.3);
    border-color: rgba(147, 197, 253, 0.6);
    transform: scale(1.02);
  }

  /* ========= Main ========= */
  .main { flex: 1; padding: 36px 24px 60px; }
  /* 内容区与主站一致（1100px） */
  .container { max-width: var(--container); margin: 0 auto; }
  .page-header { display: flex; align-items: center; margin-bottom: 28px; }
  .page-header h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 700; color: var(--text-primary); }

  /* ========= Card ========= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .card h3 { font-size: 1.02rem; font-weight: 600; margin-bottom: 16px; }

  /* ========= Tabs ========= */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: var(--radius-sm);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    transition: all var(--transition);
    font-family: inherit;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  /* ========= Form ========= */
  label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .field { margin-bottom: 16px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  textarea { resize: vertical; min-height: 52px; }

  /* ========= Buttons ========= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--primary-hover), #0f766e);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-ghost { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); color: var(--text-primary); }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }

  /* ========= 足迹列表 ========= */
  .visit-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .visit-item:last-child { border-bottom: none; }
  .visit-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .visit-main { flex: 1; min-width: 0; }
  .visit-city { font-weight: 600; font-size: 0.98rem; }
  .visit-private-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-tertiary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    vertical-align: 1px;
  }
  .visit-meta { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 2px; }
  .visit-note { font-size: 0.84rem; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .visit-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { text-align: center; color: var(--text-tertiary); font-size: 0.9rem; padding: 36px 0; }
  .msg { font-size: 0.84rem; margin-top: 10px; }
  .msg.error { color: #dc2626; }
  .msg.ok { color: #16a34a; }

  .date-selects { display: flex; gap: 8px; }
  .date-selects select { flex: 1; }

  .check-row { display: flex; align-items: center; gap: 8px; }
  .check-row input[type=checkbox] { width: auto; }
  .check-row label { margin-bottom: 0; }
  .hint { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }

  .note-count { font-size: 0.78rem; color: var(--text-tertiary); }

  /* 用户 UID 显示 */
  .user-uid {
    margin-top: 4px;
    font-size: 0.78rem;
    color: var(--text-tertiary);
    font-family: 'Consolas', 'Courier New', monospace;
  }

  /* 欢迎卡片足迹统计 */
  .visit-stats {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-secondary);
  }
  .visit-stats .stat { display: flex; align-items: baseline; gap: 5px; }
  .visit-stats .stat b { font-size: 1.15rem; color: var(--primary); font-weight: 600; }

  /* 个人中心两列布局（电脑端左资料+创建 / 右记录+成就；手机端单列） */
  .personal-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  .personal-col { display: flex; flex-direction: column; gap: 20px; }
  .personal-col .card { margin-bottom: 0; }

  /* 可折叠卡片 */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    margin-bottom: 12px;
  }
  .card-header h3 { margin-bottom: 0; }
  .card-toggle { color: var(--text-tertiary); transition: transform 0.2s ease; flex-shrink: 0; }
  .visit-list-card.collapsed .card-toggle { transform: rotate(-90deg); }
  .visit-list-card.collapsed #visitList { display: none; }

  /* 成就卡片（单列列表，每行一个成就） */
  .achievement-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .achievement {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    text-align: left;
    opacity: 0.45;
    transition: all var(--transition);
    overflow: hidden; /* 防止个别长文本在旧浏览器下把行撑出卡片 */
  }
  .achievement.done {
    opacity: 1;
    border-color: rgba(37, 99, 235, 0.4);
    background: var(--primary-light);
  }
  .achievement .icon { font-size: 1.1rem; flex-shrink: 0; }
  .achievement .name { font-size: 0.85rem; font-weight: 600; flex-shrink: 0; }
  .achievement .desc { font-size: 0.75rem; color: var(--text-tertiary); flex: 1 1 0; min-width: 0; max-width: 100%; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }

  /* 每个成就之间的间隔（成就在分类 body 内逐行渲染） */
  .category-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 成就分类折叠 */
  .achievement-category { margin-bottom: 14px; }
  .achievement-category:last-child { margin-bottom: 0; }
  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    transition: all var(--transition);
  }
  .category-header:hover { border-color: var(--primary); }
  .category-title { font-size: 0.9rem; font-weight: 600; flex: 1; }
  .category-progress { font-size: 0.75rem; color: var(--text-tertiary); }
  .category-toggle { color: var(--text-tertiary); transition: transform 0.2s ease; flex-shrink: 0; }
  .achievement-category.collapsed .category-toggle { transform: rotate(-90deg); }
  .achievement-category.collapsed .category-body { display: none; }

  /* ========= Footer ========= */
  .footer {
    background: #0f172a;
    text-align: center;
    padding: 28px 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .footer-copy { opacity: 0.6; }

  /* ========= Responsive ========= */
  @media (max-width: 768px) {
    .personal-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 16px; }
    .main { padding: 24px 16px 40px; }
    .card { padding: 18px; }
    .back-link { padding: 7px 14px; font-size: 0.84rem; }
    .row { flex-direction: column; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="City Footprint">
      <span class="brand-text"><b>City Footprint</b><span>我们走过的城市</span></span>
    </a>
    <a href="index.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      返回地图
    </a>
  </div>
</header>

<div class="main">
  <div class="container">
    <div class="page-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        个人中心
      </h1>
    </div>

    <!-- 未登录 -->
    <div id="authView">
      <div class="card">
        <div class="tabs">
          <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
          <div class="tab" id="tabReg" onclick="switchTab('reg')">注册</div>
        </div>

        <form id="loginForm" onsubmit="return doLogin(event)">
          <div class="field"><label>昵称</label><input id="loginNick" maxlength="20" required></div>
          <div class="field"><label id="passLabel">密码</label><input id="loginPass" type="password" maxlength="50" required></div>
          <div class="field" id="pass2Field" style="display:none">
            <label>确认新密码</label>
            <input id="loginPass2" type="password" minlength="4" maxlength="50" disabled>
          </div>
          <button class="btn btn-primary" type="submit" id="loginBtn">登录</button>
          <div class="msg" id="loginMsg"></div>
        </form>

        <form id="regForm" style="display:none" onsubmit="return doRegister(event)">
          <div class="field">
            <label>昵称</label>
            <input id="regNick" maxlength="20" required>
            <div class="hint">昵称注册后不可修改</div>
          </div>
          <div class="field"><label>密码</label><input id="regPass" type="password" minlength="4" maxlength="50" required></div>
          <div class="field"><label>确认密码</label><input id="regPass2" type="password" required></div>
          <div class="field" id="inviteField">
            <label>邀请码</label>
            <input id="regInvite" maxlength="20" required placeholder="请输入邀请码" autocomplete="off">
            <div class="hint">邀请码：向管理员索取，一个邀请码只能注册一次</div>
          </div>
          <button class="btn btn-primary" type="submit">注册并登录</button>
          <div class="msg" id="regMsg"></div>
        </form>
      </div>
    </div>

    <!-- 已登录 -->
    <div id="userView" style="display:none">
      <div class="personal-layout">
        <!-- 左列：个人资料 + 创建行程 -->
        <div class="personal-col">
          <div class="card">
            <h3>👤 个人资料</h3>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <div style="font-size:14px;font-weight:600;" id="welcomeText"></div>
              <button class="btn btn-ghost btn-sm" onclick="logout()">退出登录</button>
            </div>
            <div class="user-uid" id="userUid"></div>
            <div class="visit-stats" id="visitStats"></div>
          </div>

          <div class="card">
            <h3 id="formTitle">✈️ 创建行程</h3>
            <form id="addForm" onsubmit="return addVisit(event)">
              <div class="field">
                <label>城市</label>
                <input list="cityList" id="visitCity" placeholder="输入城市名选择" required autocomplete="off">
                <datalist id="cityList"></datalist>
              </div>
              <div class="row">
                <div>
                  <label>时间</label>
                  <div class="date-selects">
                    <select id="visitYear"></select>
                    <select id="visitMonth"></select>
                  </div>
                </div>
                <div class="check-row" style="align-self:flex-end;padding-bottom:10px;">
                  <input type="checkbox" id="forgotDate" onchange="toggleDate()">
                  <label for="forgotDate">记不清了</label>
                </div>
              </div>
              <div class="field">
                <div style="display:flex;justify-content:space-between;align-items:baseline;">
                  <label>备注（可选）</label>
                  <span class="note-count" id="noteCount">0/100</span>
                </div>
                <input id="visitNote" maxlength="100" placeholder="一句话留下回忆…" autocomplete="off" oninput="updateNoteCount()">
              </div>
              <div class="check-row" style="margin-bottom:16px;">
                <input type="checkbox" id="visitPrivate">
                <label for="visitPrivate">不公开行程（仅自己可见）</label>
              </div>
              <button class="btn btn-primary" type="submit">添加</button>
              <div class="msg" id="addMsg"></div>
            </form>
          </div>
        </div>

        <!-- 右列：行程记录 + 成就 -->
        <div class="personal-col">
          <div class="card visit-list-card collapsed" id="visitListCard">
            <div class="card-header" onclick="toggleVisitList()">
              <h3>📍 行程记录</h3>
              <svg class="card-toggle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div id="visitList"><div class="empty">正在加载…</div></div>
          </div>
          <div class="card">
            <h3>🏆 成就</h3>
            <div class="achievement-grid" id="achievementGrid"><div class="empty">正在加载…</div></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="footer">
  <div class="footer-copy">2026 青翔未阔工作室 · City Footprint</div>
</footer>

<script src="cities.js"></script>
<script src="app.js"></script>
<script src="achievements.js"></script>
<script>
// 城市下拉数据
const datalist = document.getElementById('cityList');
(window.CITIES || []).forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.name;
  datalist.appendChild(opt);
});

// 时间下拉（年 + 月），防止手输格式错误
(function() {
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  const currentYear = new Date().getFullYear();
  yearSel.innerHTML = '<option value="">年份</option>';
  for (let y = currentYear; y >= 2000; y--) {
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = y + ' 年';
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = '<option value="">仅年份</option>';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m).padStart(2, '0');
    opt.textContent = m + ' 月';
    monthSel.appendChild(opt);
  }
})();

// 登录/注册切换
function switchTab(mode) {
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabReg').classList.toggle('active', mode === 'reg');
  document.getElementById('loginForm').style.display = mode === 'login' ? '' : 'none';
  document.getElementById('regForm').style.display = mode === 'reg' ? '' : 'none';
}

let setPwdMode = false;

async function doLogin(e) {
  e.preventDefault();
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg error';
  if (setPwdMode && loginPass.value !== loginPass2.value) {
    msg.textContent = '两次输入的新密码不一致';
    return false;
  }
  try {
    const endpoint = setPwdMode ? '/set-password' : '/login';
    const data = await api(endpoint, {
      method: 'POST',
      body: JSON.stringify({ nickname: loginNick.value.trim(), password: loginPass.value }),
    });
    if (data.needSetPassword) {
      enterSetPasswordMode();
      return false;
    }
    saveSession(data);
    enterUserView();
  } catch (err) { msg.textContent = err.message; }
  return false;
}

// 进入"设置新密码"模式（账号密码被管理员清空后，首次登录时触发）
function enterSetPasswordMode() {
  setPwdMode = true;
  document.getElementById('passLabel').textContent = '设置新密码';
  const pass2 = document.getElementById('loginPass2');
  pass2.disabled = false;
  pass2.required = true;
  document.getElementById('pass2Field').style.display = '';
  document.getElementById('loginPass').value = '';
  pass2.value = '';
  document.getElementById('loginBtn').textContent = '设置密码并登录';
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg ok';
  msg.textContent = '该账号尚未设置密码，请设置新密码后即可登录';
  document.getElementById('loginPass').focus();
}

async function doRegister(e) {
  e.preventDefault();
  const msg = document.getElementById('regMsg');
  msg.className = 'msg error';
  if (regPass.value !== regPass2.value) { msg.textContent = '两次密码不一致'; return false; }
  try {
    const data = await api('/register', {
      method: 'POST',
      body: JSON.stringify({
        nickname: regNick.value.trim(),
        password: regPass.value,
        invite_code: regInvite.value.trim(),
      }),
    });
    saveSession(data);
    enterUserView();
  } catch (err) { msg.textContent = err.message; }
  return false;
}

// 日期切换（记不清：禁用年月下拉并清空）
function toggleDate() {
  const forgot = document.getElementById('forgotDate').checked;
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  yearSel.disabled = forgot;
  monthSel.disabled = forgot;
  if (forgot) {
    yearSel.value = '';
    monthSel.value = '';
  }
}

// 从年/月下拉组合日期值（'2024' 或 '2024-08'），未选年返回 null
function getVisitDate() {
  const y = document.getElementById('visitYear').value;
  const m = document.getElementById('visitMonth').value;
  if (!y) return null;
  return m ? y + '-' + m : y;
}

function enterUserView() {
  document.getElementById('authView').style.display = 'none';
  document.getElementById('userView').style.display = '';
  const s = getSession();
  document.getElementById('welcomeText').textContent = '你好，' + (s ? s.nickname : '') + ' 👋';
  const uidEl = document.getElementById('userUid');
  if (uidEl && s) uidEl.textContent = 'UID：' + s.userId;
  loadVisits();
}

let myVisits = [];

// 更新备注字数提醒（x/100）
function updateNoteCount() {
  const el = document.getElementById('noteCount');
  const input = document.getElementById('visitNote');
  if (el && input) el.textContent = input.value.length + '/100';
}

// 行程记录折叠开关
function toggleVisitList() {
  document.getElementById('visitListCard').classList.toggle('collapsed');
}

// 城市→省份（成就统计用）
function findProvince(city) {
  const c = (window.CITIES || []).find(x => x.name === city);
  return c ? c.province : '未知';
}

// 渲染成就卡片（4 分类，每类可折叠）
function renderAchievements() {
  const el = document.getElementById('achievementGrid');
  if (!el) return;
  // 判定逻辑在 achievements.js 的 getAchievements
  const CATEGORIES = getAchievements(myVisits.map(v => v.city));
  // 渲染分类（默认展开）
  el.innerHTML = CATEGORIES.map(cat => {
    const doneCount = cat.items.filter(a => a.done).length;
    return `
      <div class="achievement-category">
        <div class="category-header" onclick="toggleCategory(this)">
          <span class="category-title">${cat.title}</span>
          <span class="category-progress">${doneCount}/${cat.items.length}</span>
          <svg class="category-toggle" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="category-body">
          ${cat.items.map(a => `
            <div class="achievement${a.done ? ' done' : ''}">
              <div class="icon">${a.icon}</div>
              <div class="name">${a.name}</div>
              <div class="desc">${a.desc}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

// 成就分类折叠开关
function toggleCategory(header) {
  header.closest('.achievement-category').classList.toggle('collapsed');
}

// 更新欢迎卡片统计：去过几座城市（去重）+ 足迹总数
function updateVisitStats() {
  const el = document.getElementById('visitStats');
  if (!el) return;
  const cityCount = new Set(myVisits.map(v => v.city)).size;
  el.innerHTML = `
    <span class="stat">✈️ 去过 <b>${cityCount}</b> 座城市</span>
    <span class="stat">📍 足迹 <b>${myVisits.length}</b> 条</span>`;
}

async function loadVisits() {
  const list = document.getElementById('visitList');
  try {
    const data = await api('/my-visits');
    myVisits = data.visits;
    updateVisitStats();
    renderAchievements();
    if (!myVisits.length) { list.innerHTML = '<div class="empty">还没有足迹，添加第一座城市吧 ✈️</div>'; return; }
    list.innerHTML = '';
    for (let i = 0; i < myVisits.length; i++) {
      const v = myVisits[i];
      const item = document.createElement('div');
      item.className = 'visit-item';
      item.innerHTML = `
        <span class="visit-dot">${myVisits.length - i}</span>
        <div class="visit-main">
          <div class="visit-city">${escapeHtml(v.city)}${v.is_private ? '<span class="visit-private-badge" title="不公开行程，仅自己可见">🔒 不公开</span>' : ''}</div>
          <div class="visit-meta">${escapeHtml(fmtDate(v.visit_date))}</div>
          ${v.note ? `<div class="visit-note">${escapeHtml(v.note)}</div>` : ''}
        </div>
        <div class="visit-actions">
          <button class="btn btn-ghost btn-sm" onclick="startEdit(${v.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="delVisit(${v.id})">删除</button>
        </div>`;
      list.appendChild(item);
    }
  } catch (err) {
    list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
  }
}

let editingId = null;
const submitBtn = () => document.querySelector('#addForm .btn-primary');

async function addVisit(e) {
  e.preventDefault();
  const msg = document.getElementById('addMsg');
  msg.className = 'msg error';
  const name = document.getElementById('visitCity').value.trim();
  const c = findCity(name);
  if (!c) { msg.textContent = '未找到该城市，请从下拉列表选择'; return false; }

  const payload = {
    city: name,
    lat: c.lat,
    lng: c.lng,
    visit_date: getVisitDate(),
    note: document.getElementById('visitNote').value.trim(),
    is_private: document.getElementById('visitPrivate').checked,
  };

  try {
    if (editingId) {
      await api('/visits/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      msg.textContent = '已保存修改 ✅';
      resetForm();
    } else {
      await api('/visits', { method: 'POST', body: JSON.stringify(payload) });
      msg.textContent = '已添加 ✅';
      document.getElementById('visitCity').value = '';
      document.getElementById('visitNote').value = '';
      document.getElementById('visitPrivate').checked = false;
    }
    msg.className = 'msg ok';
    loadVisits();
  } catch (err) { msg.textContent = err.message; }
  return false;
}

function startEdit(id) {
  const v = myVisits.find(x => x.id === id);
  if (!v) return;
  editingId = id;
  document.getElementById('visitCity').value = v.city;
  document.getElementById('visitNote').value = v.note || '';
  document.getElementById('visitPrivate').checked = !!v.is_private;
  updateNoteCount();
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  if (v.visit_date) {
    document.getElementById('forgotDate').checked = false;
    const parts = String(v.visit_date).split('-');
    yearSel.value = parts[0] || '';
    monthSel.value = parts[1] || '';
    yearSel.disabled = false;
    monthSel.disabled = false;
  } else {
    document.getElementById('forgotDate').checked = true;
    yearSel.value = '';
    monthSel.value = '';
    yearSel.disabled = true;
    monthSel.disabled = true;
  }
  const btn = submitBtn();
  btn.textContent = '保存修改';
  document.getElementById('formTitle').textContent = '✏️ 编辑行程';
  document.getElementById('addMsg').textContent = '正在编辑：' + v.city;
  document.getElementById('addMsg').className = 'msg ok';
  document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  document.getElementById('visitCity').value = '';
  yearSel.value = '';
  monthSel.value = '';
  document.getElementById('forgotDate').checked = false;
  yearSel.disabled = false;
  monthSel.disabled = false;
  document.getElementById('visitNote').value = '';
  document.getElementById('visitPrivate').checked = false;
  updateNoteCount();
  submitBtn().textContent = '添加';
  document.getElementById('formTitle').textContent = '✈️ 创建行程';
  document.getElementById('addMsg').textContent = '';
}

async function delVisit(id) {
  if (!confirm('确定删除这条足迹吗？')) return;
  try {
    await api('/visits/' + id, { method: 'DELETE' });
    loadVisits();
  } catch (err) { alert(err.message); }
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

// 邀请码注册开关：后端强制时显示并必填，未强制时隐藏
fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg && cfg.inviteCodeRequired === false) {
    const field = document.getElementById('inviteField');
    const input = document.getElementById('regInvite');
    field.style.display = 'none';
    input.required = false;
  }
}).catch(() => { /* 后端不可达时默认强制邀请码 */ });

// 每次访问网站时验证本地凭证是否仍有效
if (getSession()) {
  api('/me')
    .then(() => enterUserView())
    .catch(() => {
      // token 失效：app.js 的 401 处理已清除本地会话并刷新回登录界面；
      // 其他错误（如网络异常）不清除凭证，停留在登录视图
    });
}
</script>
