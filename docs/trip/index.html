<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程查询 · City Footprint</title>
  <meta name="description" content="City Footprint 行程查询。">
  <meta name="theme-color" content="#0891b2">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="City Footprint 首页">
      <img src="/favicon.webp" alt="">
      <span>City Footprint</span>
    </a>
    <nav aria-label="主导航">
      <a href="/map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        <span>行程地图</span>
      </a>
      <a href="/user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
        <span>用户查询</span>
      </a>
      <a href="/trip" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16v11H4z"/><path d="M8 7V4h8v3M8 12h8"/></svg>
        <span>行程查询</span>
      </a>
    </nav>
  </header>

  <main class="lookup-page">
    <p class="lookup-kicker">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16v11H4z"/><path d="M8 7V4h8v3M8 12h8"/></svg>
      行程查询
    </p>
    <h1>查找足迹或打卡</h1>
    <p class="lookup-lead">选择类型，输入对应 UUID，查看记录及其归属。</p>

    <div class="lookup-tabs" role="tablist" aria-label="查询类型">
      <button type="button" class="lookup-tab active" data-record-type="trip" role="tab" aria-selected="true">足迹</button>
      <button type="button" class="lookup-tab" data-record-type="checkin" role="tab" aria-selected="false">打卡</button>
    </div>

    <form class="lookup-form" data-lookup="trip">
      <label for="lookupId" id="lookupLabel">行程 UUID</label>
      <div class="input-row">
        <input id="lookupId" name="id" type="text" autocomplete="off" spellcheck="false" placeholder="例如 7f3c2a1e-...">
        <button type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          查询
        </button>
      </div>
      <p class="lookup-help" id="lookupHelp">行程 UUID 可在导出数据或行程详情中查看。</p>
    </form>

    <section class="result-state" id="lookupResult" aria-live="polite" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Qxwk Studio · City Footprint</span>
      <div class="footer-links">
        <a href="/map">行程地图</a>
        <a href="/user">用户查询</a>
        <a href="/trip">行程查询</a>
        <a href="/legal/terms">用户协议</a>
        <a href="/legal/disclaimer">免责声明</a>
      </div>
    </div>
  </footer>
  <script src="/site.js"></script>
</body>
</html>
