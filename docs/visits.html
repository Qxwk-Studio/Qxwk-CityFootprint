<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>足迹管理 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="管理你在 City Footprint 的城市足迹：添加、修改、删除行程，查看成就进度。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="stylesheet" href="/style.css">
<style>
  /* 编辑弹窗打开时锁住背后页面：原生模态只让背景 inert，滚轮照样能滚到页面，
     所以照 account 页的 .no-scroll 套路手动加/去（见 startEdit 与 dialog 的 close 事件） */
  body.no-scroll { overflow: hidden; }

  /* ========= Form =========
     控件外观（label / input / select / textarea / .field）见 style.css，与 account 登录表单同一套 */
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }

  /* ========= 足迹列表 =========
     每条足迹独立成卡（外层大卡片已去掉），因此不再用分隔线，靠卡片间距区分 */
  #visitList { display: flex; flex-direction: column; gap: 10px; }
  /* 点整条 = 查看（只读弹窗，见 showVisitDetail）：列表里备注只有一行、省略号收住，
     全文在弹窗里看。pointer 只是把「这条能点」这件事说出来，与 app 端一致 */
  .visit-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .visit-dot {
    width: 24px;
    height: 24px;
    border-radius: var(--radius-full);
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .visit-main { flex: 1; min-width: 0; }
  .visit-city { font-weight: 600; font-size: 0.98rem; }
  .visit-private-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-tertiary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    vertical-align: 1px;
  }
  /* 时间与城市名同一行（见下方渲染模板）：整行都在 .visit-city 里，
     字号/字色降一档做区分；font-weight 要显式收回 400 —— .visit-city 是 600，子元素会继承成粗体 */
  .visit-meta { margin-left: 6px; font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); }
  .visit-note { font-size: 0.84rem; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 列表里的出行方式徽章（可多选，一行铺开） */
  .visit-transport { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tp-badge {
    display: inline-block;
    padding: 1px 7px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .visit-actions { display: flex; gap: 6px; flex-shrink: 0; }
  /* 分享按钮：只有图标、暂时没有行为（内容留空，等哪天真接上分享再接 onclick）。
     图标按钮把 .btn-sm 的左右 12px 内边距收掉，不然会比旁边的文字按钮胖一圈 */
  .visit-share { padding: 6px; }

  /* .empty 空态、.loading-view / .loading-spinner 加载态、.hint / .note-count 小字、
     .msg 提示文案都见 style.css */

  .date-selects { display: flex; gap: 8px; }
  .date-selects select { flex: 1; }

  /* 设置项（记不清了 / 不公开行程）用滑动开关 .switch-row，见 style.css；
     出行方式多选 chips（.transport-chips / .tp-chip）也见 style.css：与主页添加弹窗同一套 */

  /* ===== 编辑行程弹窗 =====
     用原生 <dialog>：遮罩、Esc 关闭、焦点陷阱都由浏览器给，不必再手写一套 overlay */
  .edit-dialog {
    width: calc(100% - 32px);
    max-width: 420px;
    margin: auto;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: var(--shadow-lg);
  }
  .edit-dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dialog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .dialog-header h3 { margin-bottom: 0; }
  .dialog-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    border-radius: var(--radius-full);
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-family: inherit;
    transition: background var(--transition), color var(--transition);
  }
  .dialog-close:hover { background: var(--primary-subtle); color: var(--text-primary); }
  .dialog-actions { display: flex; gap: 10px; }
  .dialog-actions .btn { flex: 1; }

  /* 查看行程弹窗里的「标签 + 值」两列：标签定宽，值吃满剩余宽度并自行折行
     （备注最长 100 字，pre-wrap 让长文本在该行里正常换行而不是撑破弹窗） */
  .detail-list { margin-bottom: 16px; }
  .detail-row { display: flex; gap: 10px; padding: 9px 0; }
  .detail-row + .detail-row { border-top: 1px solid var(--border); }
  .detail-label { flex-shrink: 0; width: 4.4em; font-size: 0.8rem; color: var(--text-tertiary); }
  .detail-value { flex: 1; min-width: 0; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .field-head label { margin-bottom: 0; }

  /* 足迹统计：改用与全站统计同一套小卡（.stat-card / .label / .value 见 style.css）。
     第一行是「时间跨度」整行长卡，其余每行两个 */
  .visit-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .visit-stats .stat-wide { grid-column: 1 / -1; }
  /* 日期串比纯数字长一倍，字号收一档免得撑满整行 */
  .visit-stats .value.date-range { font-size: 1.25rem; }

  /* 两列布局 .personal-layout / .personal-col 见 style.css（电脑端两列、窄屏并成一列） */

  /* 三节（足迹统计 / 行程记录 / 成就）都不套外层 .card、也不再折叠，标题用这个；
     字号取值与 style.css 的 .card h3 一致，改那边时这里跟着改 */
  .section-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }

  /* 成就卡片：单列堆叠，每个成就独立成卡（同样没有外层大卡片） */
  .achievement-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .achievement {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    text-align: left;
    /* 未达成的整卡压暗（白卡落到灰底上会显得偏白，0.45 太淡看不见，抬到 0.55） */
    opacity: 0.55;
    transition: all var(--transition);
    overflow: hidden;
  }
  .achievement.done {
    opacity: 1;
    border-color: rgba(37, 99, 235, 0.4);
    background: var(--primary-light);
  }
  .achievement .icon { font-size: 1.1rem; flex-shrink: 0; }
  /* 名称与说明分两行：说明与名称同在一个 .body 里，左边缘自然对齐（不再与名称挤在一行） */
  .achievement .body { flex: 1 1 0; min-width: 0; }
  .achievement .name { font-size: 0.85rem; font-weight: 600; }
  .achievement .desc { margin-top: 2px; font-size: 0.75rem; color: var(--text-tertiary); line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }
  /* 达成才有 ✓，未达成留白不占视觉重心 */
  .achievement .check {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-full);
    background: var(--primary);
    color: #fff;
    font-size: 0.65rem;
    line-height: 1;
  }
  .achievement.done .check { display: flex; }

  /* 总进度：在成就网格之上，折叠整卡时依然可见，一眼看到点亮了几座里程碑 */
  .achievement-summary {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .achievement-summary .sum-label { font-size: 0.8rem; color: var(--text-tertiary); white-space: nowrap; }
  .achievement-summary .sum-label b { color: var(--primary); font-size: 0.95rem; }
  .achievement-summary .sum-bar {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .achievement-summary .sum-bar i {
    display: block;
    height: 100%;
    background: var(--primary);
    border-radius: var(--radius-pill);
    transition: width 0.4s ease;
  }

  .category-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 成就分类：不再折叠，分类头只作标题行 */
  .achievement-category { margin-bottom: 14px; }
  .achievement-category:last-child { margin-bottom: 0; }
  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    /* 分类头直接落在页面灰底上，用 --surface 才有一块「标题区」的观感 */
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .category-title { font-size: 0.9rem; font-weight: 600; flex: 1; }
  /* 分类细进度条：轨道用 --border（分类头背景是 --surface，用 --surface 会看不见） */
  .category-bar {
    width: 74px;
    height: 6px;
    background: var(--border);
    border-radius: var(--radius-pill);
    overflow: hidden;
    flex-shrink: 0;
  }
  .category-bar i {
    display: block;
    height: 100%;
    background: var(--primary);
    border-radius: var(--radius-pill);
    transition: width 0.4s ease;
  }
  .category-progress { font-size: 0.75rem; color: var(--text-tertiary); }

  /* ========= Responsive =========
     导航/页脚的手机端缩进见 style.css，本页只有表单的 .row 要竖排 */
  @media (max-width: 640px) {
    .row { flex-direction: column; gap: 10px; }
    /* 统计小卡与全站统计一致地收一档 */
    .visit-stats { gap: 10px; }
    .visit-stats .stat-card { padding: 14px; }
    .visit-stats .value { font-size: 1.6rem; }
    .visit-stats .value.date-range { font-size: 1.1rem; }
  }
</style>
<meta name="color-scheme" content="light dark">
<!-- 主题切换：见 theme.js。必须留在 <head>、body 渲染之前，否则会闪色 -->
<script src="theme.js"></script>
<style>
  /* ===== 黑夜模式：页面元素覆盖 =====
     footer 的深色覆盖在 style.css 里 */
  :root[data-theme="dark"] .btn-danger { background:rgba(239,68,68,0.16); color:#f87171; }
  :root[data-theme="dark"] .btn-danger:hover { background:rgba(239,68,68,0.25); }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="City Footprint">
      <span class="brand-text"><b>City Footprint</b><span>我们走过的城市</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="/" class="back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        返回地图
      </a>
    </div>
  </div>
</header>

<!-- 加载中：默认显示，校验本地会话后再展示内容（避免未登录用户先看到表单） -->
<div class="loading-view" id="loadingView">
  <div class="loading-spinner"></div>
  <p>正在加载足迹数据…</p>
</div>

<div class="main" id="mainContent" style="display:none">
  <div class="container">
    <div class="page-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        足迹管理
      </h1>
    </div>

    <div class="personal-layout">
      <div class="personal-col">
        <!-- 足迹统计：不套外层大卡片，五张小卡直接落在页面上。
             外面这层 <div> 不画任何框，只为让 .personal-col 的 gap 把三节拉开 -->
        <div>
          <h3 class="section-title">📊 足迹统计</h3>
          <div class="visit-stats" id="visitStats">
            <div class="stat-card stat-wide">
              <div class="label">⏳ 时间跨度</div>
              <div class="value date-range">— → —</div>
            </div>
            <div class="stat-card"><div class="label">✈️ 去过城市</div><div class="value">0</div></div>
            <div class="stat-card"><div class="label">📍 足迹</div><div class="value">0</div></div>
            <div class="stat-card"><div class="label">🗺️ 省份</div><div class="value">0</div></div>
            <div class="stat-card"><div class="label">🚆 最常用出行</div><div class="value">—</div></div>
          </div>
        </div>

        <!-- 行程记录：每条足迹自成一张卡，标题行不可折叠 -->
        <div class="visit-list-card">
          <h3 class="section-title">📍 行程记录</h3>
          <div id="visitList"><div class="empty">正在加载…</div></div>
        </div>
      </div>

      <div class="personal-col">
        <!-- 成就：每个成就自成一张卡，分类不再折叠 -->
        <div class="achievement-card">
          <h3 class="section-title">🏆 成就</h3>
          <!-- 总进度：数字由 renderAchievements() 填 -->
          <div class="achievement-summary">
            <span class="sum-label">已点亮 <b id="achvDone">0</b> / <span id="achvTotal">0</span></span>
            <span class="sum-bar"><i id="achvBar" style="width:0%"></i></span>
          </div>
          <div class="achievement-grid" id="achievementGrid"><div class="empty">正在加载…</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 编辑行程弹窗：添加行程已统一到主页（index.html 的「添加行程」弹窗），这里只负责改一条已有记录。
     字段 id 沿用原表单那套（visitCity / visitYear / …），toggleDate / getVisitDate / updateNoteCount
     三个小工具因此原样保留，弹窗里外共用一份。 -->
<dialog class="edit-dialog" id="editDialog" aria-label="编辑行程">
  <form id="editForm" onsubmit="return saveEdit(event)">
    <div class="dialog-header">
      <h3>✏️ 编辑行程</h3>
      <button type="button" class="dialog-close" onclick="closeEditModal()" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="field">
      <label>城市（国 · 省 · 市）</label>
      <div class="city-selects" id="visitCitySelects">
        <select id="visitCountry" data-city="country" aria-label="国家"></select>
        <select id="visitProvince" data-city="province" aria-label="省份"></select>
        <select id="visitCity" data-city="city" aria-label="城市"></select>
      </div>
    </div>
    <div class="field">
      <label for="visitYear">时间</label>
      <div class="date-selects">
        <select id="visitYear"></select>
        <select id="visitMonth"></select>
      </div>
      <label class="switch-row" style="margin-top:8px;">
        <span>记不清了</span>
        <span class="switch"><input type="checkbox" id="forgotDate" onchange="toggleDate()"><span class="switch-track"></span></span>
      </label>
    </div>
    <div class="field">
      <label>出行方式（可多选）</label>
      <div class="transport-chips" id="visitTransport"></div>
    </div>
    <div class="field">
      <div class="field-head">
        <label for="visitNote">备注（可选）</label>
        <span class="note-count" id="noteCount">0/100</span>
      </div>
      <input id="visitNote" maxlength="100" placeholder="一句话留下回忆…" autocomplete="off" oninput="updateNoteCount()">
    </div>
    <label class="switch-row" style="margin-bottom:16px;">
      <span>不公开行程（仅自己可见）</span>
      <span class="switch"><input type="checkbox" id="visitPrivate"><span class="switch-track"></span></span>
    </label>
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" type="submit">保存修改</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </form>
</dialog>

<!-- 查看行程弹窗（只读）：点列表里任意一条打开。列表里的备注只占一行、多出来的省略号收住，
     全文在这里看；要改走行内那颗「编辑」，删除也在编辑弹窗里 —— 与 app 端同一套交互。
     外观直接复用上面 .edit-dialog 那套（原生 <dialog> 自带遮罩 / Esc 关闭 / 焦点陷阱）。 -->
<dialog class="edit-dialog" id="visitDetailDialog" aria-label="查看行程">
  <div class="dialog-header">
    <h3>🔍 查看行程</h3>
    <button type="button" class="dialog-close" onclick="closeVisitDetail()" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="detail-list">
    <div class="detail-row">
      <span class="detail-label">城市</span>
      <span class="detail-value" id="detailCity"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">时间</span>
      <span class="detail-value" id="detailDate"></span>
    </div>
    <!-- 出行方式与备注都可能没有：整行隐藏，不留一个空标题（showVisitDetail 里控制） -->
    <div class="detail-row" id="detailTransportRow">
      <span class="detail-label">出行方式</span>
      <span class="detail-value" id="detailTransport"></span>
    </div>
    <div class="detail-row" id="detailNoteRow">
      <span class="detail-label">备注</span>
      <span class="detail-value" id="detailNote"></span>
    </div>
  </div>
  <div class="dialog-actions">
    <button class="btn btn-primary" type="button" onclick="closeVisitDetail()">关闭</button>
  </div>
</dialog>

<footer class="footer">
  <div class="footer-copy">2026 青翔未阔工作室 · City Footprint</div>
</footer>

<script src="cities.js"></script>
<script src="app.js"></script>
<script>
// 未登录跳个人中心（那里是登录入口），已登录校验凭证后加载
if (!getSession()) {
  location.href = '/account';
} else {
  api('/me')
    .then(function () {
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('mainContent').style.display = '';
      loadVisits();
    })
    .catch(function () {
      // token 失效或校验失败：回登录入口页
      location.href = '/account';
    });
}

// 城市三级下拉（国 → 省 → 市）：联动逻辑在 app.js，与主页添加弹窗共用一份
const visitCitySelects = initCitySelects(document.getElementById('visitCitySelects'));

// 出行方式 chips（枚举与渲染逻辑在 app.js，与主页添加弹窗共用）
renderTransportChips(document.getElementById('visitTransport'));

// 时间下拉（年 + 月），防止手输格式错误
(function() {
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  const currentYear = new Date().getFullYear();
  yearSel.innerHTML = '<option value="">年份</option>';
  for (let y = currentYear; y >= 2000; y--) {
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = y + ' 年';
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = '<option value="">仅年份</option>';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m).padStart(2, '0');
    opt.textContent = m + ' 月';
    monthSel.appendChild(opt);
  }
})();

let myVisits = [];

// 日期切换（记不清：禁用年月下拉并清空）
function toggleDate() {
  const forgot = document.getElementById('forgotDate').checked;
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  yearSel.disabled = forgot;
  monthSel.disabled = forgot;
  if (forgot) {
    yearSel.value = '';
    monthSel.value = '';
  }
}

// 从年/月下拉组合日期值（'2024' 或 '2024-08'），未选年返回 null
function getVisitDate() {
  const y = document.getElementById('visitYear').value;
  const m = document.getElementById('visitMonth').value;
  if (!y) return null;
  return m ? y + '-' + m : y;
}

// 更新备注字数提醒（x/100）
function updateNoteCount() {
  const el = document.getElementById('noteCount');
  const input = document.getElementById('visitNote');
  if (el && input) el.textContent = input.value.length + '/100';
}

// 更新足迹统计：去过几座城市（去重）+ 足迹总数
// 城市 → 省份
function findProvince(city) {
  const c = (window.CITIES || []).find(x => x.name === city);
  return c ? c.province : '未知';
}

// 最常用出行方式：把每条足迹的 transport 数组摊平计票，取票数最高的一种。
// 并列时取 TRANSPORTS 展示顺序靠前的（filter 已按原顺序，稳定排序保住同票的名次）；
// 一条出行方式都没填则回「—」。返回的是中文名，去掉 label 里的 emoji ——
// 卡片标题已经带了 🚆，值里再来一个就重了。
function topTransportName() {
  const votes = {};
  myVisits.forEach(v => (v.transport || []).forEach(code => { votes[code] = (votes[code] || 0) + 1; }));
  const top = (window.TRANSPORTS || []).map(t => t.code)
    .filter(code => votes[code])
    .sort((a, b) => votes[b] - votes[a])[0];
  const label = top ? transportLabels([top])[0] : null;
  return label ? label.replace(/^\S+\s+/, '') : '—';
}

function updateVisitStats() {
  const el = document.getElementById('visitStats');
  if (!el) return;
  const cityCount = new Set(myVisits.map(v => v.city)).size;
  const provinceCount = new Set(myVisits.map(v => findProvince(v.city))).size;
  const topTransport = topTransportName();
  const dates = myVisits.map(v => v.visit_date).filter(Boolean).sort();
  const first = dates[0] || '—';
  const last = dates[dates.length - 1] || '—';
  // 第一行整行是时间跨度长卡，其余四张按每行两个排（布局见页内 .visit-stats）
  el.innerHTML = `
    <div class="stat-card stat-wide">
      <div class="label">⏳ 时间跨度</div>
      <div class="value date-range">${first} → ${last}</div>
    </div>
    <div class="stat-card">
      <div class="label">✈️ 去过城市</div>
      <div class="value">${cityCount}</div>
    </div>
    <div class="stat-card">
      <div class="label">📍 足迹</div>
      <div class="value">${myVisits.length}</div>
    </div>
    <div class="stat-card">
      <div class="label">🗺️ 省份</div>
      <div class="value">${provinceCount}</div>
    </div>
    <div class="stat-card">
      <div class="label">🚆 最常用出行</div>
      <div class="value">${topTransport}</div>
    </div>`;
}

// 渲染成就卡片：先算总进度写到卡片顶部，再按 4 个分类铺开（每类可折叠）
// CATEGORIES 直接来自 /api/my-visits 的 achievements —— 判定逻辑只留在后端
// （backend/src/achievements.js），网页不再自带一份定义，两端也不会算出不同结果。
function renderAchievements(CATEGORIES) {
  const el = document.getElementById('achievementGrid');
  if (!el) return;

  // 总进度（卡片头部那一行）：「已点亮 X / Y」+ 进度条宽度
  const doneAll = CATEGORIES.reduce((n, c) => n + c.items.filter(a => a.done).length, 0);
  const totalAll = CATEGORIES.reduce((n, c) => n + c.items.length, 0);
  const doneEl = document.getElementById('achvDone');
  const totalEl = document.getElementById('achvTotal');
  const barEl = document.getElementById('achvBar');
  if (doneEl) doneEl.textContent = doneAll;
  if (totalEl) totalEl.textContent = totalAll;
  if (barEl) barEl.style.width = (totalAll ? (doneAll / totalAll) * 100 : 0) + '%';

  el.innerHTML = CATEGORIES.map(cat => {
    const doneCount = cat.items.filter(a => a.done).length;
    const pct = cat.items.length ? (doneCount / cat.items.length) * 100 : 0;
    return `
      <div class="achievement-category">
        <div class="category-header">
          <span class="category-title">${cat.title}</span>
          <span class="category-bar"><i style="width:${pct}%"></i></span>
          <span class="category-progress">${doneCount}/${cat.items.length}</span>
        </div>
        <div class="category-body">
          ${cat.items.map(a => `
            <div class="achievement${a.done ? ' done' : ''}">
              <div class="icon">${a.icon}</div>
              <div class="body">
                <div class="name">${a.name}</div>
                <div class="desc">${a.desc}</div>
              </div>
              <span class="check">✓</span>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

async function loadVisits() {
  const list = document.getElementById('visitList');
  try {
    const data = await api('/my-visits');
    myVisits = data.visits;
    updateVisitStats();
    renderAchievements(data.achievements || []);
    if (!myVisits.length) { list.innerHTML = '<div class="empty">还没有足迹，回主页点右下角「添加行程」记一笔 ✈️</div>'; return; }
    list.innerHTML = '';
    for (let i = 0; i < myVisits.length; i++) {
      const v = myVisits[i];
      const item = document.createElement('div');
      item.className = 'visit-item';
      item.innerHTML = `
        <span class="visit-dot">${myVisits.length - i}</span>
        <div class="visit-main">
          <div class="visit-city">${escapeHtml(v.city)}${v.is_private ? '<span class="visit-private-badge" title="不公开行程，仅自己可见">🔒 不公开</span>' : ''}<span class="visit-meta">· ${escapeHtml(fmtDate(v.visit_date))}</span></div>
          ${(v.transport && v.transport.length) ? `<div class="visit-transport">${transportLabels(v.transport).map(l => `<span class="tp-badge">${escapeHtml(l)}</span>`).join('')}</div>` : ''}
          ${v.note ? `<div class="visit-note">${escapeHtml(v.note)}</div>` : ''}
        </div>
        <div class="visit-actions">
          <button class="btn btn-ghost btn-sm visit-share" type="button" title="分享" aria-label="分享">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" onclick="startEdit(${v.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="delVisit(${v.id})">删除</button>
        </div>`;
      // 点整条 = 查看（只读弹窗）。行内按钮各干各的事，点它们时别再顺手弹详情，
      // 所以先看事件是否落在动作区里
      item.onclick = (e) => {
        if (e.target.closest('.visit-actions')) return;
        showVisitDetail(v.id);
      };
      list.appendChild(item);
    }
  } catch (err) {
    list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
    // 同一个请求还供着上方五张统计卡与右侧成就：它们本来是「— → — / 0」和「正在加载…」的占位，
    // 失败时也得各自收尾，否则看着像还在加载（成就顶部那行「已点亮 X / Y」数据没变，一并写死 0）
    document.getElementById('visitStats').innerHTML = '<div class="empty stat-wide">统计加载失败</div>';
    document.getElementById('achievementGrid').innerHTML = '<div class="empty">成就加载失败</div>';
    document.getElementById('achvDone').textContent = '0';
    document.getElementById('achvTotal').textContent = '0';
    document.getElementById('achvBar').style.width = '0%';
  }
}

let editingId = null;

// 保存编辑。添加行程不在这里 —— 已统一到主页的「添加行程」弹窗（index.html），
// 全站只有那一处能新建，避免两个入口各写一份校验。
async function saveEdit(e) {
  e.preventDefault();
  if (!editingId) return false;
  const msg = document.getElementById('addMsg');
  msg.className = 'msg error';
  const name = visitCitySelects.getCity();
  const c = findCity(name);
  if (!c) { msg.textContent = '请选择省份和城市'; return false; }

  const payload = {
    city: name,
    lat: c.lat,
    lng: c.lng,
    visit_date: getVisitDate(),
    note: document.getElementById('visitNote').value.trim(),
    is_private: document.getElementById('visitPrivate').checked,
    transport: getCheckedTransports(document.getElementById('visitTransport')),
  };

  try {
    await api('/visits/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
    closeEditModal();
    loadVisits();
  } catch (err) { msg.textContent = err.message; }
  return false;
}

function startEdit(id) {
  const v = myVisits.find(x => x.id === id);
  if (!v) return;
  editingId = id;
  visitCitySelects.setCity(v.city); // 三级下拉一起回填
  document.getElementById('visitNote').value = v.note || '';
  document.getElementById('visitPrivate').checked = !!v.is_private;
  setCheckedTransports(document.getElementById('visitTransport'), v.transport);
  updateNoteCount();
  const yearSel = document.getElementById('visitYear');
  const monthSel = document.getElementById('visitMonth');
  if (v.visit_date) {
    document.getElementById('forgotDate').checked = false;
    const parts = String(v.visit_date).split('-');
    yearSel.value = parts[0] || '';
    monthSel.value = parts[1] || '';
    yearSel.disabled = false;
    monthSel.disabled = false;
  } else {
    document.getElementById('forgotDate').checked = true;
    yearSel.value = '';
    monthSel.value = '';
    yearSel.disabled = true;
    monthSel.disabled = true;
  }
  const msg = document.getElementById('addMsg');
  msg.textContent = '正在编辑：' + v.city;
  msg.className = 'msg ok';
  document.body.classList.add('no-scroll'); // 锁住背后页面：原生模态挡不住滚轮
  document.getElementById('editDialog').showModal();
}

// 关弹窗即清编辑态：点「取消」/ 保存成功直接走这里
function closeEditModal() {
  editingId = null;
  document.getElementById('editDialog').close();
  document.getElementById('addMsg').textContent = '';
}

// Esc 关闭是 <dialog> 的原生行为，不经过上面的按钮，得靠 close 事件兜住 ——
// 否则 editingId 会残留成上一条，虽然弹窗已关不会误提交，但留个脏状态迟早坑人
document.getElementById('editDialog').addEventListener('close', () => {
  editingId = null;
  document.body.classList.remove('no-scroll'); // 关弹窗（含 Esc）恢复页面滚动
});

// 查看（只读）弹窗：列表里备注只占一行、多出来的省略号收住，全文在这里看。
// 与 app 端同一套交互：点条目看详情，要改走行内那颗「编辑」，删除也在编辑弹窗里。
function showVisitDetail(id) {
  const v = myVisits.find(x => x.id === id);
  if (!v) return;
  // 城市名照旧 escapeHtml，私密徽章是固定文案 —— 与列表里那条的写法保持一致
  document.getElementById('detailCity').innerHTML =
    escapeHtml(v.city) + (v.is_private ? '<span class="visit-private-badge" title="不公开行程，仅自己可见">🔒 不公开</span>' : '');
  document.getElementById('detailDate').textContent = fmtDate(v.visit_date);

  // 出行方式、备注没填就整行隐藏（含标签）：留一个空标题比少一行更难看
  const transports = transportLabels(v.transport || []);
  document.getElementById('detailTransportRow').style.display = transports.length ? '' : 'none';
  document.getElementById('detailTransport').textContent = transports.join(' / ');
  document.getElementById('detailNoteRow').style.display = v.note ? '' : 'none';
  document.getElementById('detailNote').textContent = v.note || '';

  document.body.classList.add('no-scroll'); // 与编辑弹窗同理：原生模态挡不住背后页面的滚轮
  document.getElementById('visitDetailDialog').showModal();
}

function closeVisitDetail() {
  document.getElementById('visitDetailDialog').close();
}

// Esc 关闭不经过上面的按钮，照编辑弹窗那套用 close 事件恢复页面滚动
document.getElementById('visitDetailDialog').addEventListener('close', () => {
  document.body.classList.remove('no-scroll');
});

async function delVisit(id) {
  if (!confirm('确定删除这条足迹吗？')) return;
  try {
    await api('/visits/' + id, { method: 'DELETE' });
    loadVisits();
  } catch (err) { alert(err.message); }
}
</script>
</body>
