<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程地图 · City Footprint</title>
  <meta name="description" content="查看 City Footprint 用户点亮过的城市足迹地图。">
  <meta name="theme-color" content="#0891b2">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body class="map-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="City Footprint 首页">
      <img src="/favicon.webp" alt="">
      <span>City Footprint</span>
    </a>
    <nav aria-label="主导航">
      <a href="/map" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        <span>行程地图</span>
      </a>
      <a href="/user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
        <span>用户查询</span>
      </a>
      <a href="/trip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16v11H4z"/><path d="M8 7V4h8v3M8 12h8"/></svg>
        <span>行程查询</span>
      </a>
    </nav>
  </header>

  <main class="map-page-main">
    <div id="footprintMap" class="map-canvas-full" aria-label="公开行程地图"></div>
  </main>

  <script src="/vendor/leaflet.js"></script>
  <script>
    const API_BASE = 'https://api.travel.qxwkstudio.top';
    const map = L.map('footprintMap', { zoomControl: false, preferCanvas: true }).setView([35.5, 105], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1', '2', '3', '4'],
      maxZoom: 18,
      updateWhenIdle: false,
      attribution: '&copy; <a href="https://www.amap.com/" target="_blank" rel="noopener">高德地图</a>',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    // 边界缓存：内存 → IndexedDB（7 天）→ 网络，沿用旧版足迹地图方案。
    const geoCache = new Map();
    const GEO_DB_NAME = 'cityfootprint-geo';
    const GEO_STORE = 'boundaries';
    const GEO_MAX_AGE = 7 * 24 * 60 * 60 * 1000;
    const GEO_CONCURRENCY = 6;
    let geoActive = 0;
    const geoQueue = [];
    let geoDBPromise = null;

    function geoFetch(url) {
      return new Promise((resolve, reject) => {
        const run = () => {
          geoActive++;
          fetch(url).then(resolve).catch(reject).finally(() => {
            geoActive--;
            if (geoQueue.length) geoQueue.shift()();
          });
        };
        if (geoActive < GEO_CONCURRENCY) run();
        else geoQueue.push(run);
      });
    }

    function getGeoDB() {
      if (!geoDBPromise) {
        geoDBPromise = new Promise((resolve) => {
          try {
            const req = indexedDB.open(GEO_DB_NAME, 1);
            req.onupgradeneeded = () => {
              if (!req.result.objectStoreNames.contains(GEO_STORE)) {
                req.result.createObjectStore(GEO_STORE, { keyPath: 'adcode' });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch { resolve(null); }
        });
      }
      return geoDBPromise;
    }

    async function geoDBRead(adcode) {
      const db = await getGeoDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(GEO_STORE, 'readonly');
          const get = tx.objectStore(GEO_STORE).get(adcode);
          get.onsuccess = () => {
            const row = get.result;
            if (!row) return resolve(null);
            resolve({ data: row.data, stale: Date.now() - row.ts >= GEO_MAX_AGE });
          };
          get.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }

    async function geoDBWrite(adcode, data) {
      const db = await getGeoDB();
      if (!db) return;
      try {
        const tx = db.transaction(GEO_STORE, 'readwrite');
        tx.objectStore(GEO_STORE).put({ adcode, data, ts: Date.now() });
      } catch { /* 忽略 */ }
    }

    async function geoFetchGeo(adcode) {
      const res = await geoFetch(API_BASE + '/api/geo/' + encodeURIComponent(adcode));
      if (!res.ok) return null;
      let geo = null;
      try {
        geo = await res.json();
        if (!(geo && geo.type === 'FeatureCollection' && Array.isArray(geo.features))) geo = null;
      } catch { geo = null; }
      if (geo) geoDBWrite(adcode, geo);
      return geo;
    }

    function loadCityGeo(adcode) {
      if (!adcode) return Promise.resolve(null);
      if (!geoCache.has(adcode)) {
        const p = (async () => {
          try {
            const row = await geoDBRead(adcode);
            if (row) {
              if (row.stale) geoFetchGeo(adcode).catch(() => {});
              return row.data;
            }
            return await geoFetchGeo(adcode);
          } catch {
            return null;
          }
        })();
        p.then((geo) => { if (!geo) geoCache.delete(adcode); });
        geoCache.set(adcode, p);
      }
      return geoCache.get(adcode);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeColor(value) {
      return /^#[0-9a-f]{6}$/i.test(String(value || '')) ? value : '#0891b2';
    }

    function formatDate(at, precision) {
      if (!at || Number(precision) === 3) return '时间不详';
      const d = new Date(Number(at));
      if (!Number.isFinite(d.getTime())) return '时间不详';
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      if (Number(precision) === 0) return String(y);
      if (Number(precision) === 1) return y + '-' + m;
      return y + '-' + m + '-' + day;
    }

    function popupHtml(point) {
      let html = '<div class="popup-title">' + escapeHtml(point.city) + '</div>';
      const latest = point.latest || [];
      if (!latest.length) return html + '<div class="popup-more">暂无记录</div>';
      html += latest.map((row) =>
        '<div class="popup-person">' +
          '<span class="dot" style="background:' + safeColor(row.color) + '"></span>' +
          '<span class="meta">' + escapeHtml(formatDate(row.at, row.precision)) + '</span>' +
          '<span class="name" style="color:' + safeColor(row.color) + '">' + escapeHtml(row.nickname) + '</span>' +
        '</div>'
      ).join('');
      if (Number(point.count || 0) > 10) html += '<div class="popup-more">仅显示最近 10 条</div>';
      return html;
    }

    function dot(point, color) {
      const marker = L.circleMarker([point.lat, point.lng], {
        radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: .9,
      });
      marker.bindPopup(popupHtml(point));
      marker.addTo(layer);
    }

    async function drawPoint(point) {
      const color = point.color || point.latest?.[0]?.color || point.users?.[0]?.color || '#0891b2';
      if (!Number.isFinite(Number(point.lat)) || !Number.isFinite(Number(point.lng))) return;
      const geo = await loadCityGeo(point.adcode);
      if (!geo) {
        dot(point, color);
        return;
      }
      const shape = L.geoJSON(geo, {
        style: { color, weight: 1, fillColor: color, fillOpacity: .4 },
      });
      shape.on('mouseover', () => shape.setStyle({ fillOpacity: .62 }));
      shape.on('mouseout', () => shape.setStyle({ fillOpacity: .4 }));
      shape.bindPopup(popupHtml(point));
      shape.addTo(layer);
    }

    async function loadMap() {
      try {
        const res = await fetch(API_BASE + '/api/map', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        layer.clearLayers();
        const points = data.cities || [];
        let cursor = 0;
        async function worker() {
          while (cursor < points.length) {
            const point = points[cursor++];
            await drawPoint(point).catch(() => {});
          }
        }
        await Promise.all(Array.from({ length: Math.min(6, points.length || 1) }, worker));
      } catch {
        // 数据加载失败时保留底图，不展示额外提示
      }
    }
    loadMap();
  </script>
  <script src="/site.js"></script>
</body>
</html>
