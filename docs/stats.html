<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全站统计 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="City Footprint 全站统计：总行程、总城市、去过的城市次数排名。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="stylesheet" href="/style.css">
<style>

  /* ========= 统计大数字卡片 ========= */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  /* 小卡外观（.stat-card / .label / .value / .stat-loading）见 style.css：
     与足迹管理页的足迹统计同一套，页内只留本页的网格列数与断点 */

  /* 管理员视图提示 */
  .admin-view-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    background: #fffbeb;
    border: 1px solid #fcd34d;
    color: #92400e;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .rank-item:last-child { border-bottom: none; }
  .rank-no {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-no.top { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; }
  .rank-toggle {
    display: block;
    margin: 14px auto 0;
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--primary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .rank-toggle:hover:not(:disabled) { background: var(--primary); color: #fff; }
  .rank-toggle:disabled { color: var(--text-secondary); cursor: default; opacity: .7; }

  /* 成就达成人数 */
  .ach-count-cat {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 14px 0 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .ach-count-cat:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .ach-count-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--border);
  }
  .ach-count-item:last-child { border-bottom: none; }
  .ach-count-icon { font-size: 1.1rem; flex-shrink: 0; }
  .ach-count-name { flex: 1; font-size: 1rem; font-weight: 600; min-width: 0; }
  .ach-count-desc { font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); margin-left: 6px; }
  .ach-count-num { font-size: 0.9rem; font-weight: 600; color: var(--text-tertiary); flex-shrink: 0; }
  .ach-count-num.done { color: var(--primary); }
  .rank-city { flex: 1; font-weight: 600; font-size: 1.05rem; min-width: 0; }
  .rank-province { font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); margin-left: 6px; }
  .rank-meta { font-size: 0.8rem; color: var(--text-tertiary); flex-shrink: 0; }
  .rank-count { font-size: 0.9rem; font-weight: 600; color: var(--primary); flex-shrink: 0; min-width: 34px; text-align: right; }

  /* ========= Responsive =========
     导航/页脚的手机端缩进见 style.css，本页只写统计卡片自己的 */
  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 1.6rem; }
  }
</style>
<meta name="color-scheme" content="light dark">
<script>
/* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
(function () {
  var KEY = 'theme';
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function system() { return mq.matches ? 'dark' : 'light'; }
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
  function apply(t) { root.setAttribute('data-theme', t); }
  function current() { return stored() || system(); }
  apply(current());
  function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
  // 按钮轮询绑定（不依赖 DOMContentLoaded，避免被外部脚本阻塞导致按钮长时间无效）
  (function tryBind() {
    var btn = document.getElementById('themeToggle');
    if (btn) btn.addEventListener('click', toggle);
    else setTimeout(tryBind, 50);
  })();
  if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
})();
</script>
<style>
  /* ===== 黑夜模式：页面元素覆盖（footer 的深色覆盖在 style.css） ===== */
  :root[data-theme="dark"] .admin-view-note { background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.35); color:#fbbf24; }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="City Footprint">
      <span class="brand-text"><b>City Footprint</b><span>我们走过的城市</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="/" class="back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        返回地图
      </a>
    </div>
  </div>
</header>

<div class="main">
  <div class="container">
    <div class="page-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        全站统计
      </h1>
    </div>

    <div id="adminViewNote" class="admin-view-note" style="display:none;">👑 管理员视图 · 正在统计全部行程（含私密）</div>

    <!-- 总览 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">✈️ 总行程</div>
        <div class="value" id="totalVisits"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">🏙️ 总城市</div>
        <div class="value" id="totalCities"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">🗺️ 覆盖省份</div>
        <div class="value" id="totalProvinces"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">👥 总用户</div>
        <div class="value" id="totalUsers"><span class="stat-loading">加载中…</span></div>
      </div>
    </div>

    <!-- 城市次数排名 -->
    <div class="card">
      <h3>🏆 去过的城市次数排名</h3>
      <div id="cityRankList"><div class="loading">正在加载统计…</div></div>
    </div>

    <!-- 成就达成人数 -->
    <div class="card">
      <h3>🏅 成就达成人数</h3>
      <div id="achievementCountList"><div class="loading">正在加载统计…</div></div>
    </div>

  </div>
</div>

<footer class="footer">
  <div class="footer-copy">2026 青翔未阔工作室 · City Footprint</div>
</footer>

<script src="cities.js"></script>
<script src="app.js"></script>
<script>
// 城市→省份（从内置城市数据查询）
function findProvince(city) {
  const c = (window.CITIES || []).find(x => x.name === city);
  return c ? c.province : '';
}

// 拉取全站统计（api() 自动携带登录凭证，管理员能看到含私密的完整统计）
api('/stats')
  .then(data => {
    // 管理员视图提示（数据来自后端 isAdmin，始终与所见一致）
    const adminNote = document.getElementById('adminViewNote');
    if (adminNote) adminNote.style.display = data.isAdmin ? '' : 'none';

    document.getElementById('totalVisits').textContent = data.totalVisits;
    document.getElementById('totalCities').textContent = data.totalCities;
    document.getElementById('totalUsers').textContent = data.totalUsers;
    // 覆盖省份数：从城市排名去重省份
    const provs = new Set((data.cityRank || []).map(c => findProvince(c.city)).filter(Boolean));
    document.getElementById('totalProvinces').textContent = provs.size;

    const list = document.getElementById('cityRankList');
    if (!data.cityRank.length) {
      list.innerHTML = '<div class="empty">还没有任何足迹，去添加第一座城市吧 ✈️</div>';
      return;
    }
    list.innerHTML = '';
    const RANK_DEFAULT = 10, RANK_EXPAND = 50; // 默认前 10 名，点击展开到前 50 名
    var expanded = false;
    function drawCityRank() {
      const shown = expanded ? RANK_EXPAND : RANK_DEFAULT;
      list.innerHTML = '';
      data.cityRank.slice(0, shown).forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'rank-item';
        const province = findProvince(c.city);
        item.innerHTML = `
        <span class="rank-no${i < 3 ? ' top' : ''}">${i + 1}</span>
        <span class="rank-city">${c.city}${province ? '<span class="rank-province">· ' + province + '</span>' : ''}</span>
        <span class="rank-meta">去过 ${c.people} 人</span>
        <span class="rank-count">${c.count} 次</span>`;
        list.appendChild(item);
      });
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'rank-toggle';
      if (expanded) {
        more.textContent = '收起（仅显示前 ' + RANK_DEFAULT + ' 名）';
      } else if (data.cityRank.length > RANK_DEFAULT) {
        more.textContent = '展开查看前 ' + Math.min(RANK_EXPAND, data.cityRank.length) + ' 名（共 ' + data.cityRank.length + ' 座城市）';
      } else {
        more.textContent = '共 ' + data.cityRank.length + ' 座城市';
        more.disabled = true;
      }
      more.addEventListener('click', function () { expanded = !expanded; drawCityRank(); });
      list.appendChild(more);
    }
    drawCityRank();

    // 成就达成人数：由后端算好（判定逻辑只存在于 backend/src/achievements.js），
    // 连同 42 条成就的图标/名称/说明一起收到 —— 网页不再自带定义，也不再本地跑判定。
    // 这正是 /api/stats 不再回 users[].cities 的原因：只有 totalUsers 一个数字。
    const achList = document.getElementById('achievementCountList');
    achList.innerHTML = '';
    (data.achievements || []).forEach(cat => {
      const catEl = document.createElement('div');
      catEl.className = 'ach-count-cat';
      catEl.textContent = cat.title;
      achList.appendChild(catEl);
      cat.items.forEach(a => {
        const item = document.createElement('div');
        item.className = 'ach-count-item';
        item.innerHTML = `
          <span class="ach-count-icon">${a.icon}</span>
          <span class="ach-count-name">${a.name}${a.desc ? '<span class="ach-count-desc">' + a.desc + '</span>' : ''}</span>
          <span class="ach-count-num ${a.count > 0 ? 'done' : ''}">${a.count} 人</span>`;
        achList.appendChild(item);
      });
    });
  })
  .catch(() => {
    document.getElementById('cityRankList').innerHTML = '<div class="empty">统计加载失败，请稍后重试</div>';
  });
</script>
</body>
</html>
