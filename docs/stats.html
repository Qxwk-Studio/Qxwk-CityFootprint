<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全站统计 · City Footprint - 青翔未阔工作室</title>
<meta name="description" content="City Footprint 全站统计：总行程、总城市、去过的城市次数排名。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="stylesheet" href="/style.css">
<style>

  /* ========= 统计大数字卡片 ========= */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  /* 小卡外观（.stat-card / .label / .value / .stat-loading）见 style.css：
     与足迹管理页的足迹统计同一套，页内只留本页的网格列数与断点 */

  /* 管理员视图提示：外观（琥珀渐变胶囊）见 style.css 的 .admin-view-note，
     这里只补本页特有的「页面流内、与统计卡拉距」；文案较长，允许换行不设 nowrap */
  .admin-view-note { margin-bottom: 16px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .rank-item:last-child { border-bottom: none; }
  .rank-no {
    width: 24px;
    height: 24px;
    border-radius: var(--radius-full);
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-no.top { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; }
  .rank-toggle {
    display: block;
    margin: 14px auto 0;
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--bg);
    color: var(--primary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .rank-toggle:hover:not(:disabled) { background: var(--primary); color: #fff; }
  .rank-toggle:disabled { color: var(--text-secondary); cursor: default; opacity: .7; }

  /* 成就达成人数 */
  .ach-count-cat {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 14px 0 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .ach-count-cat:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .ach-count-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--border);
  }
  .ach-count-item:last-child { border-bottom: none; }
  .ach-count-icon { font-size: 1.1rem; flex-shrink: 0; }
  .ach-count-name { flex: 1; font-size: 1rem; font-weight: 600; min-width: 0; }
  /* 名称与说明分两行：说明左边缘与名称对齐（App 的 item_achievement_count 同款，
     说明不再以 margin-left 挤在名称后面） */
  .ach-count-desc { display: block; margin-top: 1px; font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); }
  .ach-count-num { font-size: 0.9rem; font-weight: 600; color: var(--text-tertiary); flex-shrink: 0; }
  .ach-count-num.done { color: var(--primary); }
  .rank-city { flex: 1; font-weight: 600; font-size: 1.05rem; min-width: 0; }
  .rank-province { font-size: 0.78rem; font-weight: 400; color: var(--text-tertiary); margin-left: 6px; }
  .rank-meta { font-size: 0.8rem; color: var(--text-tertiary); flex-shrink: 0; }
  .rank-count { font-size: 0.9rem; font-weight: 600; color: var(--primary); flex-shrink: 0; min-width: 34px; text-align: right; }

  /* ========= Responsive =========
     导航/页脚的手机端缩进见 style.css，本页只写统计卡片自己的 */
  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 1.6rem; }
  }
</style>
<meta name="color-scheme" content="light dark">
<!-- 主题切换：见 theme.js。必须留在 <head>、body 渲染之前，否则会闪色 -->
<script src="theme.js"></script>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="City Footprint">
      <span class="brand-text"><b>City Footprint</b><span>我们走过的城市</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="/" class="back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        返回地图
      </a>
    </div>
  </div>
</header>

<div class="main">
  <div class="container">
    <div class="page-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        全站统计
      </h1>
    </div>

    <div id="adminViewNote" class="admin-view-note" style="display:none;">👑 管理员视图 · 正在统计全部行程（含私密）</div>

    <!-- 总览 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">✈️ 总行程</div>
        <div class="value" id="totalVisits"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">🏙️ 总城市</div>
        <div class="value" id="totalCities"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">🗺️ 覆盖省份</div>
        <div class="value" id="totalProvinces"><span class="stat-loading">加载中…</span></div>
      </div>
      <div class="stat-card">
        <div class="label">👥 总用户</div>
        <div class="value" id="totalUsers"><span class="stat-loading">加载中…</span></div>
      </div>
    </div>

    <!-- 城市次数排名 -->
    <div class="card">
      <h3>🏆 去过的城市次数排名</h3>
      <div id="cityRankList"><div class="loading">正在加载统计…</div></div>
    </div>

    <!-- 成就达成人数 -->
    <div class="card">
      <h3>🏅 成就达成人数</h3>
      <div id="achievementCountList"><div class="loading">正在加载统计…</div></div>
    </div>

  </div>
</div>

<footer class="footer">
  <div class="footer-copy">2026 青翔未阔工作室 · City Footprint</div>
</footer>

<script src="cities.js"></script>
<script src="app.js"></script>
<script src="stats.js"></script>
</body>
</html>
