name: 构建和发版

# 仅手动触发：版本号和更新日志统一从根目录 release.json 读取。
# 触发后在 Actions 页面点「Run workflow」即可，不需要填写版本参数。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

  build:
    needs: backend-tests
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version from release.json
        id: release
        run: node scripts/release-info.mjs

      - name: Ensure release tag does not exist
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在，请先在 release.json 写新版本号"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # packages 必须显式写成 'platform-tools'，不能用这个 action 的默认值。
        # Google 从 2026-09-15 起不再提供 sdkmanager 的 `tools` 包，只留 platform-tools 即可。
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，正式签名构建无法进行"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: app

      - name: Build Release APK
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: app

      - name: Rename APK
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          DIR=app/build/outputs/apk/release
          APK=$(ls "$DIR"/*-arm64-v8a-release.apk 2>/dev/null) || {
            echo "::error::没找到已签名的 *-arm64-v8a-release.apk（签名没生效？），目录内容："
            ls -l "$DIR"
            exit 1
          }
          mv "$APK" "$DIR/CityFootprint-$VERSION_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityFootprint-${{ steps.release.outputs.version_name }}
          path: app/build/outputs/apk/release/CityFootprint-${{ steps.release.outputs.version_name }}.apk

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.release.outputs.version_name }}
          path: release-notes.md

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CityFootprint-${{ needs.build.outputs.version_name }}
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.build.outputs.version_name }}
          path: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/CityFootprint-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "City Footprint $VERSION_NAME" \
            --notes-file "release-notes/release-notes.md"

      - name: Generate D1 version SQL
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/d1-release-sql.mjs

      - name: Update D1 app_versions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 execute qxwk-cityfootprint --remote --file=.release-version.sql
