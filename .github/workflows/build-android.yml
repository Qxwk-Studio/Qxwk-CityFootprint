name: Build Android APK

# 手动触发（workflow_dispatch）：个人项目发版是「想发的时候点一下」，不需要每次 push 都跑一遍
# 完整的 R8 release 构建。版本号在触发时填，构建前注入 app/build.gradle.kts。
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名，例如 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本号（整数），例如 1'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # packages 必须显式写成 'platform-tools'，不能用这个 action 的默认值。
        # 它的默认值是 'tools platform-tools'，而 Google 从 2026-09-15 起不再提供 sdkmanager 的
        # `tools` 包（上游 issue #537）：默认值会让 sdkmanager 报 "Failed to find package 'tools'"
        # 并直接 exit 1，SDK 根本没装上，后面的 gradlew 全都连不上。只留 platform-tools 就绕开了，
        # 我们本来也不需要那个已废弃的旧 tools —— cmdline-tools 由这个 action 自己按
        # cmdline-tools-version 装，不受影响。
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        # 仓库里的 gradlew 是在 Windows 上提交的，可能没带可执行位，不补这一步 runner 上会 Permission denied
        run: chmod +x app/gradlew

      - name: Inject version into build.gradle.kts
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          # versionCode 必须是纯数字：Android 只认整数，填错的话报错信息在 AGP 里很难看懂，
          # 这里先拦一道并给出人话
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code 必须是纯数字，收到：$VERSION_CODE"
            exit 1
          fi
          # 10# 前缀：避免前导 0 被当成八进制（"08" 会让 $((...)) 直接报错）
          VERSION_CODE=$((10#$VERSION_CODE))
          sed -i -E "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = .*/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          # 打出来让人能在日志里核对注入结果（sed 写错了会静默地什么都不改）
          grep -nE "versionCode|versionName" app/build.gradle.kts

      - name: Restore keystore
        env:
          # keystore 不进仓库（app/.gitignore 有 *.jks / *.keystore），只以 base64 存在仓库 Secrets
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，正式签名构建无法进行（生成方式见 app/README.md 的「签名与发版」一节）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 变量名 CF_ 前缀与 app/build.gradle.kts 里读的一致（Secrets 里的名字不必跟着改）
          echo "CF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        # 成就阈值 / visit_date 校验 / 城市搜索只有单测能兜住：
        # 算错了不会崩，只会悄悄少给一个成就、或把日期显示成别的样子。放在打包之前，红了就别发版。
        run: ./gradlew testDebugUnitTest
        working-directory: app

      - name: Build Release APK
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: app

      - name: Rename APK
        # 路径写死 app-release.apk：签名配置没生效时产物叫 app-release-unsigned.apk，
        # 这一步会直接失败，不会把未签名包当正式包传上去
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/CityFootprint-${{ github.event.inputs.version_name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityFootprint-${{ github.event.inputs.version_name }}
          path: app/build/outputs/apk/release/CityFootprint-${{ github.event.inputs.version_name }}.apk