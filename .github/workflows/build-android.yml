name: Build, Release and Publish Android APK

# 仅手动触发：版本号和更新日志统一从根目录 release.json 读取。
# 触发后在 Actions 页面点「Run workflow」即可，不需要填写版本参数。
on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '版本名后缀（可选），例如 -hotfix / -rc；拼在 release.json 的版本名之后'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

  build:
    needs: backend-tests
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.effective.outputs.name }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.effective.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version from release.json
        id: release
        run: node scripts/release-info.mjs

      - name: Apply version suffix
        id: effective
        env:
          SUFFIX: ${{ inputs.version_suffix }}
          BASE: ${{ steps.release.outputs.version_name }}
        run: |
          NAME="${BASE}${SUFFIX}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        env:
          TAG: ${{ steps.effective.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在，请先在 release.json 写新版本号"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # packages 必须显式写成 'platform-tools'，不能用这个 action 的默认值。
        # Google 从 2026-09-15 起不再提供 sdkmanager 的 `tools` 包，只留 platform-tools 即可。
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，正式签名构建无法进行"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: app

      - name: Build APK (standard, sync option hidden)
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.effective.outputs.name }}
        run: ./gradlew assembleRelease -PtestVersionName="$VERSION_NAME" -PsyncOption=false
        working-directory: app

      - name: Stage standard APK
        env:
          VERSION_NAME: ${{ steps.effective.outputs.name }}
        run: |
          mkdir -p dist-out
          cp app/build/outputs/apk/release/*-arm64-v8a-release.apk "dist-out/CityFootprint-$VERSION_NAME.apk"

      - name: Build APK (sync option enabled)
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.effective.outputs.name }}
        run: ./gradlew assembleRelease -PtestVersionName="$VERSION_NAME-sync" -PsyncOption=true
        working-directory: app

      - name: Stage sync APK
        env:
          VERSION_NAME: ${{ steps.effective.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/*-arm64-v8a-release.apk "dist-out/CityFootprint-$VERSION_NAME-sync.apk"

      - name: Verify signature and versions
        env:
          VERSION_NAME: ${{ steps.effective.outputs.name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          for pair in "CityFootprint-$VERSION_NAME.apk:$VERSION_NAME" "CityFootprint-$VERSION_NAME-sync.apk:$VERSION_NAME-sync"; do
            APK="dist-out/${pair%%:*}"
            NAME="${pair##*:}"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -q "versionCode='$VERSION_CODE' versionName='$NAME'"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CityFootprint-${{ steps.effective.outputs.name }}
          path: dist-out/*.apk

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.effective.outputs.name }}
          path: release-notes.md

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CityFootprint-${{ needs.build.outputs.version_name }}
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.build.outputs.version_name }}
          path: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/CityFootprint-$VERSION_NAME.apk" \
            "dist/CityFootprint-$VERSION_NAME-sync.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "City Footprint $VERSION_NAME" \
            --notes-file "release-notes/release-notes.md"

      - name: Generate D1 version SQL
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: node scripts/d1-release-sql.mjs

      - name: Update D1 app_versions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 execute qxwk-cityfootprint --remote --file=.release-version.sql
