name: Build Signed Debug APK

# 仅手动触发，只产出 debug APK，不发版、不更新 D1。
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Debug 版本名，例如 2.3.2'
        required: true
        type: string
      version_code:
        description: 'Debug versionCode，例如 20302'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_name 必须是 x.y.z，例如 2.3.2"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::version_code 必须是正整数，例如 20302"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，调试包无法使用正式签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: app

      - name: Build Debug APK
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_VERSION_NAME: ${{ inputs.version_name }}
          DEBUG_VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew assembleDebug -PuseReleaseSigningForDebug=true -PdebugVersionName="$DEBUG_VERSION_NAME" -PdebugVersionCode="$DEBUG_VERSION_CODE"
        working-directory: app

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CityFootprint-debug-${{ inputs.version_name }}
          path: app/build/outputs/apk/debug/CityFootprint-*-debug.apk
          if-no-files-found: error
